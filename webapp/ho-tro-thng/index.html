<title>Hỗ trợ THNG · Hệ thống quản lý nghiệp vụ</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ============ THNG Support — green corporate theme ============ */
:root{
  --green-900:#063d2b; --green-800:#0a5138; --green-700:#0f6e4e; --green-600:#14875f;
  --green-500:#1a9d70; --green-400:#37b98a; --green-300:#7fd7b6; --green-50:#e9f7f0;
  --amber:#e0a400; --amber-bg:#fff6e0; --red:#d64545; --red-bg:#fdeaea;
  --blue:#2f6fd6; --blue-bg:#eaf1fd;
  --ink:#122019; --ink-2:#3f5349; --ink-3:#6b7d74; --line:#dbe7e0; --line-2:#eef4f0;
  --bg:#f4f8f6; --card:#ffffff; --shadow:0 1px 2px rgba(6,61,43,.06),0 8px 24px -12px rgba(6,61,43,.18);
  --radius:14px; --font:'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--green-700)}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--green-900),var(--green-800));color:#dff1e9;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--green-400),var(--green-600));display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.brand .logo svg{width:24px;height:24px}
.brand b{font-size:16px;color:#fff;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--green-300);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#cfe8dd;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;transition:.15s}
.nav button svg{width:18px;height:18px;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav button .badge{margin-left:auto;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600}
.side-foot{margin-top:auto;font-size:11px;color:var(--green-300);padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:20px}
.topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.topbar .spacer{flex:1}
.content{padding:26px 28px 60px;max-width:1400px;width:100%}

/* buttons */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn:hover{border-color:var(--green-400);color:var(--green-700)}
.btn svg{width:16px;height:16px}
.btn.primary{background:linear-gradient(135deg,var(--green-600),var(--green-700));border-color:transparent;color:#fff;box-shadow:0 8px 18px -10px var(--green-700)}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--green-50)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}

/* cards & KPI */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lbl{color:var(--ink-3);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:8px;line-height:1}
.kpi .foot{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.kpi .spark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;position:absolute;right:16px;top:16px}
.kpi .spark svg{width:18px;height:18px}
.kpi.accent{background:linear-gradient(135deg,var(--green-700),var(--green-800));border-color:transparent;color:#fff}
.kpi.accent .lbl,.kpi.accent .foot{color:#bfe6d5}
.kpi.warn .val{color:var(--amber)} .kpi.bad .val{color:var(--red)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-h{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.panel-h h3{font-size:15px}
.panel-h .spacer{flex:1}
.panel-b{padding:18px 20px}

/* bar chart */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:180px 1fr 46px;align-items:center;gap:12px;font-size:13px}
.bar-row .track{background:var(--line-2);height:12px;border-radius:8px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--green-500),var(--green-700));transition:width .5s}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums}

/* table */
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{background:var(--green-50);color:var(--green-800);text-align:left;padding:11px 12px;font-weight:600;white-space:nowrap;position:sticky;top:0;border-bottom:1px solid var(--line)}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:var(--green-50)}
tbody tr{cursor:pointer}
.mono{font-variant-numeric:tabular-nums;font-weight:600;color:var(--green-800)}
.muted{color:var(--ink-3)}
.ell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.green{background:var(--green-50);color:var(--green-700)} .pill.green .dot{background:var(--green-500)}
.pill.amber{background:var(--amber-bg);color:#8a6500} .pill.amber .dot{background:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)} .pill.red .dot{background:var(--red)}
.pill.blue{background:var(--blue-bg);color:var(--blue)} .pill.blue .dot{background:var(--blue)}
.pill.gray{background:#eef1f0;color:var(--ink-2)} .pill.gray .dot{background:var(--ink-3)}
.pr{font-weight:700}
.pr.P1{color:var(--red)} .pr.P2{color:#c07500} .pr.P3{color:var(--blue)} .pr.P4{color:var(--ink-3)}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.field-sel{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-2);font-weight:500}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-300);outline-offset:0;border-color:var(--green-400)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,61,43,.42);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:34px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:920px;box-shadow:0 30px 80px -20px rgba(6,61,43,.5);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 24px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:14px;position:sticky;top:0;background:#fff;border-radius:18px 18px 0 0;z-index:2}
.modal-h h3{font-size:17px}
.modal-h .spacer{flex:1}
.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2)}
.x:hover{border-color:var(--red);color:var(--red)}
.modal-b{padding:22px 24px}
.modal-f{padding:16px 24px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 18px 18px}

/* form */
.steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.step{flex:1;min-width:130px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:12.5px;font-weight:600;color:var(--ink-3);display:flex;gap:9px;align-items:center;background:#fff;transition:.15s}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--line-2);color:var(--ink-2);display:grid;place-items:center;font-size:12px;flex:none}
.step.active{border-color:var(--green-500);color:var(--green-800);background:var(--green-50)}
.step.active .n{background:var(--green-600);color:#fff}
.fs{display:none} .fs.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.f textarea{resize:vertical;min-height:64px}
.hint{font-size:11.5px;color:var(--ink-3)}
.sec-title{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line-2)}
.readbox{grid-column:1/-1;background:var(--green-50);border:1px dashed var(--green-300);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--green-800);display:flex;gap:18px;flex-wrap:wrap}
.readbox b{color:var(--green-900)}

.dl{display:grid;grid-template-columns:200px 1fr;gap:0}
.dl dt{padding:9px 0;color:var(--ink-3);font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line-2)}
.dl dd{padding:9px 0;margin:0;border-bottom:1px solid var(--line-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:transparent;border:0;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;font-size:13.5px}
.tabs button.active{color:var(--green-700);border-bottom-color:var(--green-600)}
.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green-800);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:80;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.catcol{display:flex;flex-direction:column;gap:5px}
.catcol .h{font-weight:700;color:var(--green-800);font-size:13px;margin-bottom:4px}
.catcol .i{font-size:12.5px;color:var(--ink-2);padding:5px 10px;background:var(--green-50);border-radius:8px}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{flex-direction:row;flex-wrap:wrap}.side-foot{display:none}.form-grid,.dl{grid-template-columns:1fr}}
</style>

<script>
/* ============================ DỮ LIỆU DANH MỤC ============================ */
const CAT = {
  loai: ["Sự cố dịch vụ - gián đoạn vận hành","Bảo trì - bảo dưỡng định kỳ","Sửa chữa - khắc phục hỏng hóc","Giao nhận hàng hóa cho khách hàng","Lắp đặt - nghiệm thu tại điểm khách hàng","Khiếu nại - yêu cầu xử lý của khách hàng","Luân chuyển chứng từ nội bộ","Di dời - điều chuyển tài sản, thiết bị","Hỗ trợ sự kiện - hội nghị","Hỗ trợ kho vận - xuất nhập kho","Vận chuyển tiền - tài sản có giá","Mua sắm - cấp phát vật dụng","Hỗ trợ nhân sự - phương tiện","Photo - in ấn - scan tài liệu","Khác"],
  donvi: ["P. Kế toán","P. Kinh doanh","P. Nhân sự","P. Hành chính","P. Kho vận","P. Kỹ thuật","Ban Giám đốc","KH - Cty ABC","KH - Cty XYZ","Khác"],
  doi: ["Đội Giao nhận 1","Đội Giao nhận 2","Đội Kỹ thuật - Bảo trì","Đội Kho vận","Đội Hành chính - Sự kiện","Đội trực khẩn cấp"],
  uutien: ["P1 - Khẩn cấp","P2 - Ưu tiên cao","P3 - Ưu tiên trung bình","P4 - Thấp"],
  trangthai: ["1. Tạo mới","2. Đã phân công","3. Đang xử lý","4. Chờ phản hồi/Chờ duyệt","5. Đã xử lý","6. Hoàn tất","7. Mở lại"],
  nghiemthu: ["Đạt - nghiệm thu đủ","Đạt - có điều chỉnh","Không đạt - phải làm lại","Hoàn thành một phần","Hủy yêu cầu"],
  loaiPS: ["Chi phí phát sinh","Sự cố hàng hóa (hư hỏng/thiếu/mất)","Sai lệch chứng từ","Chậm trễ tiến độ","Thiếu nhân sự - phương tiện","Thay đổi yêu cầu từ NSD","Vượt phạm vi hỗ trợ","Khác"],
  duyet: ["Chờ duyệt","Đã duyệt","Duyệt một phần","Từ chối","Yêu cầu bổ sung hồ sơ"],
  dvt: ["Thùng","Kiện","Bao","Cái","Bộ","Hộp","Tập","Kg","Chuyến","Lần","Người","Khác"]
};
// Ánh xạ Loại công việc -> Luồng (6 loại đầu = KH bên ngoài, còn lại = Nội bộ)
const FLOW_EXTERNAL = new Set(CAT.loai.slice(0,6));
const flowOf = l => FLOW_EXTERNAL.has(l) ? "Hỗ trợ Khách hàng bên ngoài" : "Hỗ trợ Nội bộ";
// SLA theo ưu tiên: [phản hồi phút, xử lý giờ]
const SLA = {"P1 - Khẩn cấp":[15,2],"P2 - Ưu tiên cao":[30,4],"P3 - Ưu tiên trung bình":[60,8],"P4 - Thấp":[120,24]};
const slaOf = p => SLA[p] || [60,8];
const WY_WARN = 0.8; // ngưỡng vàng
const WORK = {mStart:8,mEnd:12,aStart:13,aEnd:17}; // giờ làm việc

/* ============================ STORE ============================ */
const KEY="thng_support_v2";
let DB={tickets:[],ps:[],seq:{}};
function load(){try{const r=localStorage.getItem(KEY);if(r)DB=JSON.parse(r);}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function uid(pfx,d){const day=d||new Date();const k=pfx+ymd(day);DB.seq[k]=(DB.seq[k]||0)+1;return `${pfx}-${ymd(day)}-${String(DB.seq[k]).padStart(4,"0")}`;}
function ymd(d){return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;}

/* ============================ SLA / GIỜ LÀM VIỆC ============================ */
function workingHours(start,end){
  if(!start||!end) return null;
  let s=new Date(start), e=new Date(end); if(e<=s) return 0;
  let mins=0, cur=new Date(s);
  let guard=0;
  while(cur<e && guard++<200000){
    const day=cur.getDay(); // 0=CN,6=T7
    if(day>=1 && day<=5){ // T2-T6
      mins+=segOverlap(cur,e,WORK.mStart,WORK.mEnd);
      mins+=segOverlap(cur,e,WORK.aStart,WORK.aEnd);
    }
    cur.setDate(cur.getDate()+1); cur.setHours(0,0,0,0);
  }
  return +(mins/60).toFixed(2);
}
function segOverlap(dayStart,end,h1,h2){
  const d=new Date(dayStart);
  const a=new Date(d); a.setHours(h1,0,0,0);
  const b=new Date(d); b.setHours(h2,0,0,0);
  const lo=Math.max(dayStart.getTime(),a.getTime());
  const hi=Math.min(end.getTime(),b.getTime());
  return hi>lo ? (hi-lo)/60000 : 0;
}
// Trả về {pct, used, deadline, color, label} cho SLA xử lý
function slaStatus(t){
  const [,resH]=slaOf(t.uutien);
  const start=t.tStart||t.tAssign||t.tCreate;
  const isDone=["5. Đã xử lý","6. Hoàn tất"].includes(t.trangthai);
  const end=isDone&&t.tDone?t.tDone:new Date().toISOString();
  const used=workingHours(start,end);
  if(used===null) return {pct:0,used:0,deadline:resH,color:"gray",label:"Chưa tính"};
  const pct=resH>0?used/resH:0;
  let color="green",label="Trong hạn";
  if(pct>1){color="red";label="Đỏ - Vi phạm SLA";}
  else if(pct>=WY_WARN){color="amber";label="Vàng - Sắp đến hạn";}
  else {color="green";label=isDone?"Đạt SLA":"Trong hạn";}
  if(isDone && pct<=1){color="green";label="Đạt SLA";}
  return {pct,used,deadline:resH,color,label};
}

/* ============================ SEED ============================ */
function seed(){
  if(DB.tickets.length) return;
  const d=new Date("2026-08-03T08:15:00");
  DB.seq["TK20260803"]=0; DB.seq["PS20260803"]=0;
  const id=uid("TK",d);
  const t={
    id, tCreate:d.toISOString(),
    loai:"Giao nhận hàng hóa cho khách hàng", luong:flowOf("Giao nhận hàng hóa cho khách hàng"),

/* ---------- DASHBOARD ---------- */
function renderDash(){
  const T=DB.tickets;
  const done=T.filter(t=>["6. Hoàn tất","5. Đã xử lý"].includes(t.trangthai)).length;
  const open=T.length-done;
  const waiting=T.filter(t=>t.trangthai==="4. Chờ phản hồi/Chờ duyệt").length;
  let red=0,amber=0,slaOk=0,doneCnt=0,csatSum=0,csatN=0,reopen=0,sumH=0,sumHn=0;
  T.forEach(t=>{const s=slaStatus(t);if(s.color==="red")red++;if(s.color==="amber")amber++;
    if(["6. Hoàn tất","5. Đã xử lý"].includes(t.trangthai)){doneCnt++;if(s.pct<=1)slaOk++;sumH+=s.used;sumHn++;}
    if(t.csat){csatSum+=+t.csat;csatN++;} reopen+=(+t.moLai||0);});
  const psWait=DB.ps.filter(p=>p.duyet==="Chờ duyệt").length;
  const costDX=DB.ps.reduce((a,p)=>a+(+p.chiphiDX||0),0);
  const costOK=DB.ps.reduce((a,p)=>a+(+p.chiphiDuyet||0),0);
  const slaPct=doneCnt?Math.round(slaOk/doneCnt*100):0;
  const avgH=sumHn?(sumH/sumHn).toFixed(1):"0";
  const avgCsat=csatN?(csatSum/csatN).toFixed(1):"–";

  const kpi=(lbl,val,cls,foot,icon,tone)=>`<div class="kpi ${cls||''}">
    <div class="lbl">${lbl}</div><div class="val">${val}</div>${foot?`<div class="foot">${foot}</div>`:''}
    ${icon?`<div class="spark" style="background:${tone||'var(--green-50)'}"><svg viewBox="0 0 24 24" fill="none" stroke="${tone?'#fff':'var(--green-600)'}" stroke-width="2">${icon}</svg></div>`:''}</div>`;

  // phân bố
  const byPr=CAT.uutien.map(p=>[p,T.filter(t=>t.uutien===p).length]);
  const byFlow=[["Hỗ trợ Khách hàng bên ngoài",0],["Hỗ trợ Nội bộ",0]];T.forEach(t=>{const i=t.luong===byFlow[0][0]?0:1;byFlow[i][1]++;});
  const bySt=CAT.trangthai.map(s=>[s,T.filter(t=>t.trangthai===s).length]);
  const max=arr=>Math.max(1,...arr.map(x=>x[1]));
  const barBlock=(arr,mx)=>`<div class="bars">${arr.map(([n,v])=>`<div class="bar-row"><span class="muted">${n}</span><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><b>${v}</b></div>`).join("")}</div>`;

  document.getElementById("view").innerHTML=`
    <div class="grid kpis" style="margin-bottom:22px">
      ${kpi("Tổng ticket tiếp nhận",T.length,"accent","Kỳ hiện tại",'<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>','rgba(255,255,255,.18)')}
      ${kpi("Đã hoàn tất / đóng",done,"","Đang mở: "+open,'<path d="M20 6L9 17l-5-5"/>')}
      ${kpi("Quá hạn SLA (Đỏ)",red,red?"bad":"","Cần xử lý ngay",'<path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>',red?'var(--red)':null)}
      ${kpi("Sắp đến hạn (Vàng)",amber,amber?"warn":"","Theo dõi sát",'<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>',amber?'var(--amber)':null)}
      ${kpi("Đạt SLA xử lý",slaPct+"%","","Trên "+doneCnt+" ticket đã xong",'<path d="M22 11.08V12a10 10 0 11-5.93-9.14M22 4L12 14.01l-3-3"/>')}
      ${kpi("Chờ phản hồi/duyệt",waiting,"","Đang tạm dừng SLA",'<path d="M12 6v6l4 2"/>')}
      ${kpi("CSAT bình quân",avgCsat+" ★","","Trên "+csatN+" đánh giá",'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z"/>')}
      ${kpi("TG xử lý bình quân",avgH+"h","","Giờ làm việc",'<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>')}
      ${kpi("Phát sinh chờ duyệt",psWait,psWait?"warn":"","Cần phê duyệt",'<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>')}
      ${kpi("Chi phí PS đề xuất",fmtVnd(costDX),"","Đã duyệt: "+fmtVnd(costOK),'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>')}
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="panel"><div class="panel-h"><h3>Theo mức độ ưu tiên</h3></div><div class="panel-b">${barBlock(byPr,max(byPr))}</div></div>
      <div class="panel"><div class="panel-h"><h3>Theo luồng công việc</h3></div><div class="panel-b">${barBlock(byFlow,max(byFlow))}</div></div>
    </div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Theo vòng đời ticket (7 trạng thái)</h3></div><div class="panel-b">${barBlock(bySt,max(bySt))}</div></div>`;
}

    </div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Mã Ticket</th><th>Nội dung / Loại</th><th>Đơn vị YC</th><th>Ưu tiên</th><th>Người xử lý</th><th>Trạng thái</th><th>SLA xử lý</th></tr></thead>

    <div class="f"><label>Email <span class="req">*</span></label>${inp("email","text","a.nguyen@congty.vn")}</div>
    <div class="f"><label>Người theo dõi (Watchers/CC)</label>${inp("watchers","text","Trưởng phòng; Kế toán…")}</div>
    <div class="f full"><label>Nội dung yêu cầu (chi tiết) <span class="req">*</span></label>${ta("noidung","Mô tả công việc cần hỗ trợ…")}</div>

  </div>`;
  const step1=`<div class="form-grid">
    <div class="sec-title">Bước 2 · Phân công & theo dõi SLA</div>
    <div class="f"><label>Nhóm/Đội hỗ trợ</label>${sel("doi",[""].concat(CAT.doi))}</div>
    <div class="f"><label>Người xử lý chính (Assignee)</label>${inp("assignee","text","Trần Văn B")}</div>
    <div class="f"><label>Người phối hợp</label>${inp("phoihop")}</div>
    <div class="f"><label>Thời gian phân công</label>${inp("tAssign","datetime-local")}</div>
    <div class="f"><label>Thời gian bắt đầu xử lý</label>${inp("tStart","datetime-local")}</div>
    <div class="f"><label>Trạng thái ticket</label>${sel("trangthai",CAT.trangthai)}</div>
  </div>`;
  const step2=`<div class="form-grid">
    <div class="sec-title">Bước 3 · Thực hiện & nghiệm thu</div>
    <div class="f"><label>Thời gian hoàn tất thực tế</label>${inp("tDone","datetime-local")}</div>
    <div class="f"><label>Số lượng thực tế</label>${inp("slThucte","number")}</div>
    <div class="f"><label>Địa điểm giao nhận thực tế</label>${inp("diadiemThucte")}</div>
    <div class="f"><label>Người nhận / ký xác nhận</label>${inp("nguoiNhan")}</div>
    <div class="f"><label>Kết quả nghiệm thu</label>${sel("nghiemthu",[""].concat(CAT.nghiemthu))}</div>
    <div class="f full"><label>Đề xuất hướng giải quyết</label>${ta("dexuat")}</div>
    <div class="f full"><label>Việc đã thực hiện</label>${ta("dathuchien")}</div>
    <div class="f full"><label>Link file đính kèm (tên file, ≤25MB)</label>${inp("attach","text","BBGN.pdf; anh.jpg")}</div>
  </div>`;
  const step3=`<div class="form-grid">
    <div class="sec-title">Bước 5 · Đánh giá CSAT & đóng ticket</div>
    <div class="f"><label>CSAT (1–5 sao)</label>${sel("csat",["","1","2","3","4","5"])}</div>
    <div class="f"><label>Ngày đóng ticket</label>${inp("tClose","datetime-local")}</div>
    <div class="f"><label>Số lần mở lại</label>${inp("moLai","number")}</div>
    <div class="f full"><label>Nhận xét của người yêu cầu</label>${ta("nhanxet")}</div>
    <div class="f full"><label>Ghi chú</label>${ta("ghichu")}</div>
  </div>`;
  const steps=[step0,step1,step2,step3];
  const o=document.getElementById("overlay");
  o.innerHTML=`<div class="modal">
    <div class="modal-h"><h3>${isNew?"Tạo ticket mới":"Cập nhật ticket "+esc(t.id)}</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <div class="steps">${FSTEPS.map((s,i)=>`<div class="step ${i===FSTEP?'active':''}" onclick="FSTEP=${i};drawForm()"><span class="n">${i+1}</span>${s}</div>`).join("")}</div>
      ${steps[FSTEP]}
    </div>
    <div class="modal-f">
      ${FSTEP>0?`<button class="btn" onclick="FSTEP--;drawForm()">← Trước</button>`:''}
      <div style="flex:1"></div>
      ${!isNew?`<button class="btn danger" onclick="delTicket('${t.id}')">Xóa</button>`:''}
      ${FSTEP<3?`<button class="btn" onclick="FSTEP++;drawForm()">Tiếp →</button>`:''}
      <button class="btn primary" onclick="saveTicket()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>Lưu ticket</button>
    </div></div>`;
}
window.flowOf=flowOf;
function saveTicket(){
  const t=EDIT;
  if(!t.loai){toast("Vui lòng chọn Loại công việc",true);FSTEP=0;drawForm();return;}
  if(!t.nguoiYC||!t.noidung){toast("Vui lòng nhập Người yêu cầu và Nội dung",true);FSTEP=0;drawForm();return;}
  const isNew=!DB.tickets.some(x=>x.id===t.id);
  if(isNew){t.id=uid("TK");t.tCreate=new Date().toISOString();t.luong=flowOf(t.loai);DB.tickets.unshift(t);}
  else{const i=DB.tickets.findIndex(x=>x.id===t.id);t.luong=flowOf(t.loai);DB.tickets[i]=t;}
  save();closeModal();buildNav();render();toast(isNew?"Đã tạo ticket "+t.id:"Đã cập nhật ticket");
}
function delTicket(id){if(!confirm("Xóa ticket "+id+"?"))return;DB.tickets=DB.tickets.filter(t=>t.id!==id);save();closeModal();buildNav();render();toast("Đã xóa ticket");}

/* ============================ CHI TIẾT TICKET ============================ */
function openDetail(id,tab){
  const t=DB.tickets.find(x=>x.id===id);if(!t)return;
  const s=slaStatus(t);const [rp,rh]=slaOf(t.uutien);
  const ps=DB.ps.filter(p=>p.ticketId===id);
  const row=(k,v)=>`<dt>${k}</dt><dd>${v||'<span class="muted">–</span>'}</dd>`;
  const TAB=tab||"info";
  const info=`<dl class="dl">
    ${row("Mã Ticket",`<b class="mono">${esc(t.id)}</b>`)}
    ${row("Thời gian tạo",fmtDT(t.tCreate))}
    ${row("Loại công việc",esc(t.loai))}
    ${row("Luồng",esc(t.luong))}
    ${row("Đơn vị / KH",esc(t.donvi))}
    ${row("Người yêu cầu",esc(t.nguoiYC)+` · ${esc(t.sdt)} · ${esc(t.email)}`)}
    ${row("Người theo dõi",esc(t.watchers))}
    ${row("Nội dung",esc(t.noidung))}
    ${row("Số lượng",(t.soluong||'–')+" "+esc(t.dvt||''))}
    ${row("Quy cách",esc(t.quycach))}
    ${row("Địa điểm giao → nhận",esc(t.diadiemGiao)+" → "+esc(t.diadiemNhan))}
    ${row("TG mong muốn",fmtDT(t.tGiaoYC))}
  </dl>`;
  const proc=`<dl class="dl">
    ${row("Ưu tiên",`<span class="pr ${t.uutien.split(' ')[0]}">${esc(t.uutien)}</span>`)}
    ${row("SLA quy định",`Phản hồi ${rp} phút · Xử lý ${rh} giờ`)}
    ${row("Nhóm/Đội",esc(t.doi))}
    ${row("Người xử lý",esc(t.assignee))}
    ${row("Người phối hợp",esc(t.phoihop))}
    ${row("TG phân công",fmtDT(t.tAssign))}
    ${row("TG bắt đầu xử lý",fmtDT(t.tStart))}
    ${row("TG hoàn tất",fmtDT(t.tDone))}
    ${row("Đã dùng (giờ LV)",`<b>${s.used}h</b> / ${s.deadline}h`)}
    ${row("Trạng thái SLA",`<span class="pill ${s.color}"><span class="dot"></span>${s.label}</span>`)}
    ${row("Trạng thái ticket",stPill(t.trangthai))}
    ${row("SL thực tế",(t.slThucte||'–')+(t.slThucte&&t.soluong?` (lệch ${t.slThucte-t.soluong})`:''))}
    ${row("Kết quả nghiệm thu",esc(t.nghiemthu))}
    ${row("Đề xuất giải quyết",esc(t.dexuat))}
    ${row("Đã thực hiện",esc(t.dathuchien))}
    ${row("Đính kèm",esc(t.attach))}
    ${row("CSAT",t.csat?('★'.repeat(+t.csat)+`<span class="muted"> (${t.csat}/5)</span>`):'')}
    ${row("Nhận xét",esc(t.nhanxet))}
    ${row("Ngày đóng",fmtDT(t.tClose))}
  </dl>`;
  const psTab=ps.length?`<div class="table-wrap"><table><thead><tr><th>Mã PS</th><th>Loại</th><th>Mô tả</th><th>CP đề xuất</th><th>Duyệt</th></tr></thead>
    <tbody>${ps.map(p=>`<tr><td class="mono">${p.id}</td><td>${esc(p.loai)}</td><td>${esc(p.mota)}</td><td>${fmtVnd(p.chiphiDX)}</td><td>${duyetPill(p.duyet)}</td></tr>`).join("")}</tbody></table></div>
    <button class="btn sm" style="margin-top:14px" onclick="openPS('${id}')">+ Thêm phát sinh cho ticket này</button>`
    :`<div class="empty" style="padding:34px"><div>Ticket chưa có phát sinh.</div><button class="btn sm" style="margin-top:14px" onclick="openPS('${id}')">+ Ghi nhận phát sinh</button></div>`;

  document.getElementById("overlay").innerHTML=`<div class="modal">
    <div class="modal-h"><h3 class="mono" style="color:var(--green-800)">${esc(t.id)}</h3>
      <span class="pill ${s.color}"><span class="dot"></span>${s.label}</span>${stPill(t.trangthai)}
      <div class="spacer"></div><button class="btn sm" onclick="openForm('${t.id}')">Chỉnh sửa</button><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <div class="tabs">
        <button class="${TAB==='info'?'active':''}" onclick="openDetail('${id}','info')">Thông tin chung</button>
        <button class="${TAB==='proc'?'active':''}" onclick="openDetail('${id}','proc')">Xử lý & SLA</button>
        <button class="${TAB==='ps'?'active':''}" onclick="openDetail('${id}','ps')">Phát sinh (${ps.length})</button>
      </div>
      ${TAB==='info'?info:TAB==='proc'?proc:psTab}
    </div></div>`;
  document.getElementById("overlay").classList.add("show");
}

/* ============================ FORM PHÁT SINH ============================ */
let EDITPS=null;
function openPS(ticketId){
  const tid=ticketId||(DB.tickets[0]&&DB.tickets[0].id)||"";
  const t=DB.tickets.find(x=>x.id===tid);
  EDITPS={id:"(tự sinh)",ticketId:tid,ngay:new Date().toISOString().slice(0,10),loai:CAT.loaiPS[0],mota:"",nguyennhan:"",anhhuong:"Trung bình",chiphiDX:"",chiphiDuyet:"",duyet:"Chờ duyệt",attach:"",nguoiXL:t?t.assignee:""};
  drawPS();document.getElementById("overlay").classList.add("show");
}
function drawPS(){
  const p=EDITPS;
  const sel=(n,arr)=>`<select onchange="EDITPS.${n}=this.value">${arr.map(x=>`<option ${x===p[n]?'selected':''}>${esc(x)}</option>`).join("")}</select>`;
  const inp=(n,type="text",ph="")=>`<input type="${type}" value="${esc(p[n]??'')}" placeholder="${ph}" oninput="EDITPS.${n}=this.value">`;
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:720px">
    <div class="modal-h"><h3>Ghi nhận phát sinh</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="form-grid">
      <div class="f"><label>Mã Ticket liên quan <span class="req">*</span></label><select onchange="EDITPS.ticketId=this.value">${DB.tickets.map(t=>`<option value="${t.id}" ${t.id===p.ticketId?'selected':''}>${t.id} — ${esc(t.noidung.slice(0,30))}</option>`).join("")}</select></div>
      <div class="f"><label>Ngày phát sinh</label>${inp("ngay","date")}</div>
      <div class="f"><label>Loại phát sinh</label>${sel("loai",CAT.loaiPS)}</div>
      <div class="f"><label>Mức độ ảnh hưởng</label>${sel("anhhuong",["Thấp","Trung bình","Cao","Nghiêm trọng"])}</div>
      <div class="f full"><label>Mô tả chi tiết <span class="req">*</span></label><textarea oninput="EDITPS.mota=this.value" placeholder="Mô tả phát sinh…">${esc(p.mota)}</textarea></div>
      <div class="f full"><label>Nguyên nhân</label><textarea oninput="EDITPS.nguyennhan=this.value">${esc(p.nguyennhan)}</textarea></div>
      <div class="f"><label>Chi phí đề xuất (VNĐ)</label>${inp("chiphiDX","number")}</div>
      <div class="f"><label>Chi phí được duyệt (VNĐ)</label>${inp("chiphiDuyet","number")}</div>
      <div class="f"><label>Người xử lý</label>${inp("nguoiXL")}</div>
      <div class="f"><label>Trạng thái phê duyệt</label>${sel("duyet",CAT.duyet)}</div>
      <div class="f full"><label>Chứng từ / hình ảnh đính kèm</label>${inp("attach","text","BBGN.pdf; anh.jpg")}</div>
    </div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="savePS()">Lưu phát sinh</button></div></div>`;
}
function savePS(){
  const p=EDITPS;if(!p.ticketId||!p.mota){toast("Chọn ticket và nhập mô tả",true);return;}
  p.id=uid("PS");DB.ps.unshift(p);save();closeModal();buildNav();render();toast("Đã ghi nhận phát sinh "+p.id);
}

/* ============================ HÀM CHUNG ============================ */
function closeModal(){document.getElementById("overlay").classList.remove("show");}
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtVnd(n){n=+n||0;return n?n.toLocaleString("vi-VN")+" ₫":"–";}
function fmtDT(s){if(!s)return"";const d=new Date(s);if(isNaN(d))return esc(s);return d.toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function toast(msg,bad){const el=document.getElementById("toast");el.innerHTML=(bad?'⚠️ ':'✓ ')+esc(msg);el.style.background=bad?'var(--red)':'var(--green-800)';el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2600);}
function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});dl(blob,"ho-tro-thng-"+ymd(new Date())+".json");toast("Đã xuất dữ liệu JSON");}
function exportCSV(){
  const cols=["id","tCreate","loai","luong","donvi","nguoiYC","sdt","email","noidung","soluong","dvt","uutien","doi","assignee","trangthai","tDone","nghiemthu","csat"];
  const head=cols.join(",");
  const rows=DB.tickets.map(t=>cols.map(c=>`"${String(t[c]==null?'':t[c]).replace(/"/g,'""')}"`).join(","));
  const blob=new Blob(["﻿"+head+"\n"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  dl(blob,"tickets-thng.csv");toast("Đã xuất CSV");
}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

/* ============================ INIT ============================ */
load();seed();buildNav();go("dash");
</script>
