<title>Hỗ trợ THNG · Hệ thống quản lý nghiệp vụ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ============ THNG Support — green corporate theme ============ */
:root{
  --green-900:#081f38; --green-800:#0f3157; --green-700:#1b4f86; --green-600:#2563b8;
  --green-500:#2f6fd6; --green-400:#4f8ce8; --green-300:#a7c6ee; --green-50:#eaf1fc;
  --amber:#e0a400; --amber-bg:#fff6e0; --red:#d64545; --red-bg:#fdeaea;
  --blue:#2f6fd6; --blue-bg:#eaf1fd;
  --ink:#122019; --ink-2:#3f5349; --ink-3:#6b7d74; --line:#dbe7e0; --line-2:#eef4f0;
  --bg:#f4f8f6; --card:#ffffff; --shadow:0 1px 2px rgba(6,61,43,.06),0 8px 24px -12px rgba(6,61,43,.18);
  --radius:14px; --font:'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--green-700)}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--green-800),var(--green-900));color:#dbe9fb;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--green-400),var(--green-600));display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.brand .logo svg{width:24px;height:24px}
.brand b{font-size:16px;color:#fff;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--green-300);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#cfe0f5;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;transition:.15s}
.nav button svg{width:18px;height:18px;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav button .badge{margin-left:auto;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600}
.side-foot{margin-top:auto;font-size:11px;color:var(--green-300);padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:20px}
.topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.topbar .spacer{flex:1}
.content{padding:26px 28px 60px;max-width:1400px;width:100%}

/* buttons */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn:hover{border-color:var(--green-400);color:var(--green-700)}
.btn svg{width:16px;height:16px}
.btn.primary{background:linear-gradient(135deg,var(--green-600),var(--green-700));border-color:transparent;color:#fff;box-shadow:0 8px 18px -10px var(--green-700)}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--green-50)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}

/* cards & KPI */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lbl{color:var(--ink-3);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:8px;line-height:1}
.kpi .foot{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.kpi .spark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;position:absolute;right:16px;top:16px}
.kpi .spark svg{width:18px;height:18px}
.kpi.accent{background:linear-gradient(135deg,var(--green-700),var(--green-800));border-color:transparent;color:#fff}
.kpi.accent .lbl,.kpi.accent .foot{color:#bfe6d5}
.kpi.warn .val{color:var(--amber)} .kpi.bad .val{color:var(--red)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-h{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.panel-h h3{font-size:15px}
.panel-h .spacer{flex:1}
.panel-b{padding:18px 20px}

/* bar chart */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:180px 1fr 46px;align-items:center;gap:12px;font-size:13px}
.bar-row .track{background:var(--line-2);height:12px;border-radius:8px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--green-500),var(--green-700));transition:width .5s}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums}

/* table */
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{background:var(--green-50);color:var(--green-800);text-align:left;padding:11px 12px;font-weight:600;white-space:nowrap;position:sticky;top:0;border-bottom:1px solid var(--line)}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:var(--green-50)}
tbody tr{cursor:pointer}
.mono{font-variant-numeric:tabular-nums;font-weight:600;color:var(--green-800)}
.muted{color:var(--ink-3)}
.ell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.green{background:#e7f6ee;color:#1a7a4f} .pill.green .dot{background:#25a56a}
.pill.amber{background:var(--amber-bg);color:#8a6500} .pill.amber .dot{background:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)} .pill.red .dot{background:var(--red)}
.pill.blue{background:var(--blue-bg);color:var(--blue)} .pill.blue .dot{background:var(--blue)}
.pill.gray{background:#eef1f0;color:var(--ink-2)} .pill.gray .dot{background:var(--ink-3)}
.pr{font-weight:700}
.pr.P1{color:var(--red)} .pr.P2{color:#c07500} .pr.P3{color:var(--blue)} .pr.P4{color:var(--ink-3)}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.field-sel{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-2);font-weight:500}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-300);outline-offset:0;border-color:var(--green-400)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,61,43,.42);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:34px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:920px;box-shadow:0 30px 80px -20px rgba(6,61,43,.5);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 24px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:14px;position:sticky;top:0;background:#fff;border-radius:18px 18px 0 0;z-index:2}
.modal-h h3{font-size:17px}
.modal-h .spacer{flex:1}
.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2)}
.x:hover{border-color:var(--red);color:var(--red)}
.modal-b{padding:22px 24px}
.modal-f{padding:16px 24px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 18px 18px}

/* form */
.steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.step{flex:1;min-width:130px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:12.5px;font-weight:600;color:var(--ink-3);display:flex;gap:9px;align-items:center;background:#fff;transition:.15s}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--line-2);color:var(--ink-2);display:grid;place-items:center;font-size:12px;flex:none}
.step.active{border-color:var(--green-500);color:var(--green-800);background:var(--green-50)}
.step.active .n{background:var(--green-600);color:#fff}
.fs{display:none} .fs.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.f textarea{resize:vertical;min-height:64px}
.hint{font-size:11.5px;color:var(--ink-3)}
.sec-title{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line-2)}
.readbox{grid-column:1/-1;background:var(--green-50);border:1px dashed var(--green-300);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--green-800);display:flex;gap:18px;flex-wrap:wrap}
.readbox b{color:var(--green-900)}

.dl{display:grid;grid-template-columns:200px 1fr;gap:0}
.dl dt{padding:9px 0;color:var(--ink-3);font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line-2)}
.dl dd{padding:9px 0;margin:0;border-bottom:1px solid var(--line-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:transparent;border:0;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;font-size:13.5px}
.tabs button.active{color:var(--green-700);border-bottom-color:var(--green-600)}
.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green-800);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:80;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.catcol{display:flex;flex-direction:column;gap:5px}
.catcol .h{font-weight:700;color:var(--green-800);font-size:13px;margin-bottom:4px}
.catcol .i{font-size:12.5px;color:var(--ink-2);padding:5px 10px;background:var(--green-50);border-radius:8px}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{flex-direction:row;flex-wrap:wrap}.side-foot{display:none}.form-grid,.dl{grid-template-columns:1fr}}

/* ---- user area in sidebar ---- */
.userbox{margin-top:auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.userbox .who{display:flex;align-items:center;gap:10px}
.userbox .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--green-400),var(--green-600));display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.userbox .nm{color:#fff;font-weight:600;font-size:13px;line-height:1.2}
.userbox .rl{color:var(--green-300);font-size:11px;margin-top:2px}
.userbox .acts{display:flex;gap:6px}
.userbox button{flex:1;background:rgba(255,255,255,.09);border:0;color:#dbe9fb;padding:7px;border-radius:8px;font-size:12px;font-weight:600}
.userbox button:hover{background:rgba(255,255,255,.18);color:#fff}

/* ---- login screen ---- */
.login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 20% -10%,rgba(47,111,214,.28),transparent),linear-gradient(135deg,var(--green-900),#04162b)}
.login.show{display:flex}
.login-card{background:var(--card);border-radius:20px;box-shadow:0 40px 100px -20px rgba(0,0,0,.6);width:100%;max-width:400px;overflow:hidden}
.login-top{background:linear-gradient(135deg,var(--green-700),var(--green-800));padding:26px 28px;color:#fff;display:flex;align-items:center;gap:14px}
.login-top .logo{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.15);display:grid;place-items:center}
.login-top .logo svg{width:26px;height:26px}
.login-top b{font-size:18px;display:block;line-height:1.1}
.login-top span{font-size:11.5px;color:var(--green-300);letter-spacing:.06em;text-transform:uppercase}
.login-body{padding:26px 28px 22px}
.login-body h2{font-size:16px;margin-bottom:4px}
.login-body p{color:var(--ink-3);font-size:13px;margin:0 0 18px}
.login-body .f{margin-bottom:14px}
.login-err{background:var(--red-bg);color:var(--red);padding:9px 12px;border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:none}
.login-err.show{display:block}
.login-body .btn.primary{width:100%;justify-content:center;padding:11px}
.login-hint{margin-top:16px;font-size:11.5px;color:var(--ink-3);background:var(--green-50);border-radius:10px;padding:11px 13px;line-height:1.6}
.login-hint b{color:var(--green-800)}
.role-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.role-admin{background:#fdeaea;color:#b3341f} .role-dieuphoi{background:#eaf1fd;color:#2f6fd6}
.role-xuly{background:var(--green-50);color:var(--green-700)} .role-yeucau{background:#fff6e0;color:#8a6500} .role-giamdoc{background:#eef1f0;color:var(--ink-2)}

/* ---- action bar + lịch sử trạng thái ---- */
.actbar{margin:2px 0 16px;padding:12px 14px;background:var(--green-50);border:1px solid var(--line);border-radius:12px}
.actbar .lbl{font-size:12px;font-weight:700;color:var(--green-700);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px}
.actbar .row{display:flex;gap:8px;flex-wrap:wrap}
.histbox{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.hrow{position:relative;padding:8px 0}
.hrow .hdot{position:absolute;left:-21px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--green-500);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" fill="#fff" opacity=".95"/><path d="M9 12l2 2 4-4" stroke="#0f6e4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>Hỗ trợ THNG</b><span>Support Desk</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox" id="userbox"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">Dashboard điều hành</h1><div class="sub" id="pageSub">Tổng quan chỉ số nghiệp vụ hỗ trợ</div></div>
      <div class="spacer"></div>
      <span class="pill green" id="connDot"><span class="dot"></span>Đang kết nối…</span>
      <button class="btn" onclick="exportData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Xuất dữ liệu</button>
      <button class="btn primary" id="btnNewTop" onclick="openForm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>Tạo ticket</button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>

<div class="login" id="login">
  <div class="login-card">
    <div class="login-top">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" fill="#fff" opacity=".95"/><path d="M9 12l2 2 4-4" stroke="#0f6e4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>Hỗ trợ THNG</b><span>Support Desk</span></div>
    </div>
    <div class="login-body">
      <h2>Đăng nhập hệ thống</h2>
      <p>Vui lòng đăng nhập bằng tài khoản được cấp.</p>
      <div class="login-err" id="loginErr"></div>
      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="f"><label>Tên đăng nhập</label><input id="lgUser" autocomplete="username" autofocus></div>
        <div class="f"><label>Mật khẩu</label><input id="lgPass" type="password" autocomplete="current-password"></div>
        <button class="btn primary" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Đăng nhập</button>
      </form>
      <div class="login-hint" id="loginHint">Chưa có tài khoản? Vui lòng liên hệ <b>Quản trị hệ thống</b> hoặc bộ phận <b>IT</b> để được cấp.</div>
    </div>
  </div>
</div>

<script>
/* ============================ DỮ LIỆU DANH MỤC ============================ */
const CAT = {

/* ============================ SLA / GIỜ LÀM VIỆC ============================ */
function workingHours(start,end){
  if(!start||!end) return null;
  let s=new Date(start), e=new Date(end); if(e<=s) return 0;
  let mins=0, cur=new Date(s);
  let guard=0;
  while(cur<e && guard++<200000){
    const day=cur.getDay(); // 0=CN,6=T7
    if(day>=1 && day<=5){ // T2-T6
      mins+=segOverlap(cur,e,WORK.mStart,WORK.mEnd);
      mins+=segOverlap(cur,e,WORK.aStart,WORK.aEnd);
    }
    cur.setDate(cur.getDate()+1); cur.setHours(0,0,0,0);
  }
  return +(mins/60).toFixed(2);
}
function segOverlap(dayStart,end,h1,h2){
  const d=new Date(dayStart);
  const a=new Date(d); a.setHours(h1,0,0,0);
  const b=new Date(d); b.setHours(h2,0,0,0);
  const lo=Math.max(dayStart.getTime(),a.getTime());
  const hi=Math.min(end.getTime(),b.getTime());
  return hi>lo ? (hi-lo)/60000 : 0;
}
/* ---- Trạng thái & quy trình (v3) ---- */
function baseStatus(s){return String(s||"").replace(/^\d+\.\s*/,"").trim();}
function isClosed(s){const b=baseStatus(s);return b==="Hoàn tất"||b==="Từ chối";}
// Trạng thái đồng hồ SLA đang CHẠY (tích lũy thời gian xử lý)
function isRunning(s){return ["Đã tiếp nhận","Đang xử lý","Mở lại"].includes(baseStatus(s));}
// Trạng thái ĐANG DỪNG đồng hồ SLA (chờ/tạm dừng)
function isStopped(s){return ["Chờ phản hồi","Chờ duyệt","Tạm dừng","Trả lại bổ sung"].includes(baseStatus(s));}
// Trả về {pct, used, total, stopped, deadline, color, label} cho SLA xử lý — có dừng/chạy theo lịch sử
function slaStatus(t){
  const [,resH]=slaOf(t.uutien);
  const closed=isClosed(t.trangthai);
  const now=new Date().toISOString();
  const endTime=closed ? (t.tClose||t.tDone||now) : now;
  let used=0,total=0,stopped=0;
  const hist=Array.isArray(t.history)?t.history:null;
  if(hist && hist.length){
    let tiepNhanSeen=false;
    for(let i=0;i<hist.length;i++){
      const from=hist[i].at, to=(i+1<hist.length?hist[i+1].at:endTime), st=hist[i].to;
      const wh=workingHours(from,to)||0;
      if(isRunning(st)) used+=wh;
      if(baseStatus(st)==="Đã tiếp nhận") tiepNhanSeen=true;
      if(tiepNhanSeen) total+=wh;
    }
    stopped=+(total-used).toFixed(2); used=+used.toFixed(2); total=+total.toFixed(2);
  } else {
    // Ticket cũ chưa có lịch sử: tính đơn giản
    const start=t.tStart||t.tAssign||t.tCreate;
    used=workingHours(start, closed?(t.tDone||endTime):now)||0; total=used;
  }
  const pct=resH>0?used/resH:0;
  let color="green",label="Trong hạn";
  if(pct>1){color="red";label=closed?"Đã vi phạm SLA":"Đỏ - Vi phạm SLA";}
  else if(!closed && isStopped(t.trangthai)){color="gray";label="Tạm dừng SLA";}
  else if(pct>=WY_WARN){color="amber";label="Vàng - Sắp đến hạn";}
  else {color="green";label=closed?"Đạt SLA":"Trong hạn";}
  return {pct,used,total,stopped,deadline:resH,color,label};
}

function stColor(s){const b=baseStatus(s);
  if(b==="Hoàn tất")return "green";
  if(b==="Từ chối"||b==="Mở lại")return "red";
  if(["Chờ phản hồi","Chờ duyệt","Tạm dừng","Trả lại bổ sung"].includes(b))return "amber";
  if(["Đang xử lý","Đã tiếp nhận","Đã xử lý"].includes(b))return "blue";
  return "gray";}
function stPill(s){return `<span class="pill ${stColor(s)}"><span class="dot"></span>${esc(baseStatus(s))}</span>`;}

    <div class="f"><label>Email <span class="req">*</span></label>${inp("email","text","a.nguyen@congty.vn")}</div>
    <div class="f"><label>Người theo dõi (Watchers/CC)</label>${inp("watchers","text","Trưởng phòng; Kế toán…")}</div>

  const step2=`<div class="form-grid">

window.flowOf=flowOf;
async function saveTicket(){
  const t=EDIT;
  if(!t.loai){toast("Vui lòng chọn Loại công việc",true);FSTEP=0;drawForm();return;}
  if(!t.nguoiYC||!t.noidung){toast("Vui lòng nhập Người yêu cầu và Nội dung",true);FSTEP=0;drawForm();return;}
  const isNew=!DB.tickets.some(x=>x.id===t.id);
  t.luong=flowOf(t.loai);
  try{
    if(isNew){delete t.id;await api("POST","/api/tickets",t);}
    else{await api("PUT","/api/tickets/"+encodeURIComponent(t.id),t);}
    await refresh();closeModal();buildNav();render();toast(isNew?"Đã tạo ticket mới":"Đã cập nhật ticket");
  }catch(e){toast("Lỗi lưu (kiểm tra kết nối máy chủ)",true);}
}
async function delTicket(id){
  if(!confirm("Xóa ticket "+id+"?"))return;
  try{await api("DELETE","/api/tickets/"+encodeURIComponent(id));await refresh();closeModal();buildNav();render();toast("Đã xóa ticket");}
  catch(e){toast("Lỗi xóa (kiểm tra kết nối)",true);}
}

/* ============================ HÀNH ĐỘNG QUY TRÌNH (v3) ============================ */
function nextActions(t){
  const s=baseStatus(t.trangthai); const A=[];
  const add=(to,label,need,cap)=>A.push({to,label,need:!!need,cap:cap||'edit'});
  if(s==='Tạo mới'){ add('Đã tiếp nhận','Tiếp nhận (đủ điều kiện)',false,'edit'); add('Trả lại bổ sung','Trả lại bổ sung',true,'edit'); add('Từ chối','Từ chối',true,'edit'); }
  else if(s==='Trả lại bổ sung'){ add('Tạo mới','Gửi lại (đã bổ sung)',false,'create'); }
  else if(s==='Đã tiếp nhận'){ add('Đang xử lý','Bắt đầu xử lý',false,'edit'); add('Từ chối','Từ chối',true,'edit'); }
  else if(s==='Đang xử lý'){ add('Đã xử lý','Hoàn thành xử lý',false,'edit'); add('Chờ phản hồi','Chờ phản hồi NYC',false,'edit'); add('Chờ duyệt','Chờ duyệt phát sinh',false,'edit'); add('Tạm dừng','Tạm dừng',true,'edit'); }
  else if(s==='Chờ phản hồi'||s==='Chờ duyệt'){ add('Đang xử lý','Tiếp tục xử lý',false,'edit'); }
  else if(s==='Tạm dừng'){ add('Đang xử lý','Tiếp tục xử lý',false,'edit'); add('Đã tiếp nhận','Phân loại lại (Bước 2)',true,'edit'); }
  else if(s==='Đã xử lý'){ add('Hoàn tất','Nghiệm thu đạt → Hoàn tất',false,'edit'); add('Mở lại','Mở lại (chưa đạt)',true,'edit'); }
  else if(s==='Mở lại'){ add('Đang xử lý','Tiếp tục xử lý',false,'edit'); }
  else if(s==='Hoàn tất'){ add('Mở lại','Mở lại',true,'edit'); }
  return A;
}
function actionAllowed(a){ return a.cap==='create' ? can('create') : can(a.cap); }
function doAction(id, idx){
  const a=(window.__acts||[])[idx]; if(!a)return;
  const t=DB.tickets.find(x=>x.id===id); if(!t)return; const to=a.to;
  // Bước 2 — tiếp nhận: mở hộp chốt ưu tiên
  if(baseStatus(to)==='Đã tiếp nhận' && baseStatus(t.trangthai)==='Tạo mới'){ openReceive(id); return; }
  // Chốt kế hoạch: phải có Người thực hiện trước khi Đang xử lý
  if(baseStatus(t.trangthai)==='Đã tiếp nhận' && baseStatus(to)==='Đang xử lý' && !(t.assignee&&String(t.assignee).trim())){
    toast('Cần phân công Người thực hiện (nút Chỉnh sửa) trước khi bắt đầu xử lý',true); return;
  }
  if(a.need){ askReason(a.label,(reason)=>applyStatus(id,to,reason,{})); return; }
  applyStatus(id,to,'',{});
}
async function applyStatus(id,to,reason,extra){
  const src=DB.tickets.find(x=>x.id===id); if(!src)return;
  const t=JSON.parse(JSON.stringify(src));
  t.trangthai=to; t._reason=reason||'';
  if(baseStatus(to)==='Mở lại') t.moLai=(+t.moLai||0)+1;
  if(baseStatus(to)==='Hoàn tất' && !t.tClose) t.tClose=new Date().toISOString().slice(0,16);
  if(baseStatus(to)==='Đã xử lý' && !t.tDone) t.tDone=new Date().toISOString().slice(0,16);
  Object.assign(t, extra||{});
  try{ await api('PUT','/api/tickets/'+encodeURIComponent(id),t); await refresh(); buildNav(); render(); openDetail(id,'proc'); toast('Đã cập nhật: '+baseStatus(to)); }
  catch(e){ toast(e.message||'Lỗi cập nhật',true); }
}
function askReason(title,cb){
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:480px">
    <div class="modal-h"><h3>${esc(title)}</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="f"><label>Lý do <span class="req">*</span></label><textarea id="rsReason" placeholder="Nhập lý do (tối thiểu 5 ký tự)…" style="min-height:90px"></textarea><div class="hint">Bắt buộc ghi lý do — lưu vào lịch sử ticket, không xóa vết.</div></div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" id="rsOk">Xác nhận</button></div></div>`;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("rsOk").onclick=()=>{const v=document.getElementById("rsReason").value.trim(); if(v.length<5){toast('Vui lòng ghi lý do (tối thiểu 5 ký tự)',true);return;} cb(v);};
}
function priNum(x){const m=String(x).match(/P(\d)/);return m?+m[1]:3;}
function openReceive(id){
  const t=DB.tickets.find(x=>x.id===id); if(!t)return;
  const deXuat=t.uutienDeXuat||t.uutien;
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:520px">
    <div class="modal-h"><h3>Tiếp nhận & phân loại (Bước 2)</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <div class="hint" style="margin-bottom:12px">Mức ưu tiên người yêu cầu đề xuất: <b>${esc(deXuat)}</b></div>
      <div class="f"><label>Mức ưu tiên chính thức <span class="req">*</span></label><select id="rcPri">${CAT.uutien.map(x=>`<option ${x===t.uutien?'selected':''}>${esc(x)}</option>`).join("")}</select></div>
      <div class="f" style="margin-top:12px"><label>Lý do (bắt buộc nếu hạ cấp ưu tiên)</label><textarea id="rcReason" placeholder="VD: yêu cầu không gấp, có thể xếp lịch…" style="min-height:70px"></textarea></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" id="rcOk">Xác nhận tiếp nhận</button></div></div>`;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("rcOk").onclick=()=>{
    const pri=document.getElementById("rcPri").value; const reason=document.getElementById("rcReason").value.trim();
    if(priNum(pri)>priNum(deXuat) && reason.length<5){ toast('Hạ cấp ưu tiên: vui lòng ghi lý do (tối thiểu 5 ký tự)',true); return; }
    applyStatus(id,'Đã tiếp nhận', reason||('Tiếp nhận, chốt '+pri), {uutien:pri});
  };
}

let EDITPS=null, PS_EDITING=false;
function openPS(ticketId,psId){
  if(psId){const ex=DB.ps.find(x=>x.id===psId);if(ex){EDITPS=JSON.parse(JSON.stringify(ex));PS_EDITING=true;drawPS();document.getElementById("overlay").classList.add("show");return;}}
  const tid=ticketId||(DB.tickets[0]&&DB.tickets[0].id)||"";
  const t=DB.tickets.find(x=>x.id===tid);
  PS_EDITING=false;
  EDITPS={id:"(tự sinh)",ticketId:tid,ngay:new Date().toISOString().slice(0,10),loai:CAT.loaiPS[0],mota:"",nguyennhan:"",anhhuong:"Trung bình",chiphiDX:"",chiphiDuyet:"",duyet:"Chờ duyệt",attach:"",nguoiXL:t?t.assignee:""};

}
function drawPS(){

    <div class="modal-h"><h3>${PS_EDITING?"Phê duyệt / cập nhật phát sinh "+esc(p.id):"Ghi nhận phát sinh"}</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="form-grid">
      <div class="f"><label>Mã Ticket liên quan <span class="req">*</span></label><select onchange="EDITPS.ticketId=this.value">${DB.tickets.map(t=>`<option value="${t.id}" ${t.id===p.ticketId?'selected':''}>${t.id} — ${esc(t.noidung.slice(0,30))}</option>`).join("")}</select></div>
      <div class="f"><label>Ngày phát sinh</label>${inp("ngay","date")}</div>

      <div class="f full"><label>Mô tả chi tiết <span class="req">*</span></label><textarea oninput="EDITPS.mota=this.value" placeholder="Mô tả phát sinh…">${esc(p.mota)}</textarea></div>
      <div class="f full"><label>Nguyên nhân</label><textarea oninput="EDITPS.nguyennhan=this.value">${esc(p.nguyennhan)}</textarea></div>
      <div class="f"><label>Chi phí đề xuất (VNĐ)</label>${inp("chiphiDX","number")}</div>
      <div class="f"><label>Chi phí được duyệt (VNĐ)</label>${inp("chiphiDuyet","number")}</div>
      <div class="f"><label>Người xử lý</label>${inp("nguoiXL")}</div>
      <div class="f"><label>Trạng thái phê duyệt</label>${sel("duyet",CAT.duyet)}</div>
      <div class="f full"><label>Chứng từ / hình ảnh đính kèm</label>${inp("attach","text","BBGN.pdf; anh.jpg")}</div>
    </div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="savePS()">Lưu phát sinh</button></div></div>`;
}
async function savePS(){
  const p=EDITPS;if(!p.ticketId||!p.mota){toast("Chọn ticket và nhập mô tả",true);return;}
  try{
    if(PS_EDITING){await api("PUT","/api/ps/"+encodeURIComponent(p.id),p);}
    else{delete p.id;await api("POST","/api/ps",p);}
    await refresh();closeModal();buildNav();render();toast(PS_EDITING?"Đã cập nhật phát sinh":"Đã ghi nhận phát sinh");
  }catch(e){toast(e.message||"Lỗi lưu",true);}
}

/* ============================ HÀM CHUNG ============================ */
function closeModal(){if(FORCE_PW)return;document.getElementById("overlay").classList.remove("show");}
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtVnd(n){n=+n||0;return n?n.toLocaleString("vi-VN")+" ₫":"–";}
function fmtDT(s){if(!s)return"";const d=new Date(s);if(isNaN(d))return esc(s);return d.toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function toast(msg,bad){const el=document.getElementById("toast");el.innerHTML=(bad?'⚠️ ':'✓ ')+esc(msg);el.style.background=bad?'var(--red)':'var(--green-800)';el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2600);}
function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});dl(blob,"ho-tro-thng-"+ymd(new Date())+".json");toast("Đã xuất dữ liệu JSON");}
function exportCSV(){
  const cols=["id","tCreate","loai","luong","donvi","nguoiYC","sdt","email","noidung","soluong","dvt","uutien","doi","assignee","trangthai","tDone","nghiemthu","csat"];
  const head=cols.join(",");
  const rows=DB.tickets.map(t=>cols.map(c=>`"${String(t[c]==null?'':t[c]).replace(/"/g,'""')}"`).join(","));
  const blob=new Blob(["﻿"+head+"\n"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  dl(blob,"tickets-thng.csv");toast("Đã xuất CSV");
}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

async function renderUsers(){

  try{USERS=await api("GET","/api/users");}catch(e){return;}
  const rows=USERS.map(u=>`<tr>
    <td class="mono">${esc(u.username)}${u.username===ME.username?' <span class="muted">(bạn)</span>':''}</td>
    <td>${esc(u.name)}</td>
    <td><span class="role-badge role-${u.role}">${esc(ROLE_VI[u.role]||u.role)}</span></td>
    <td>${esc(u.dept||'–')}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn sm" onclick="openUser('${esc(u.username)}')">Sửa</button>
      ${u.username!==ME.username?`<button class="btn sm danger" onclick="delUser('${esc(u.username)}')">Xóa</button>`:''}
    </td></tr>`).join("");
  document.getElementById("view").innerHTML=`
    <div class="toolbar"><div class="muted">Tổng ${USERS.length} tài khoản</div><div class="spacer" style="flex:1"></div>
      <button class="btn primary sm" onclick="openUser()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>Thêm người dùng</button></div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Phòng ban</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Giải thích vai trò</h3></div><div class="panel-b" style="display:grid;gap:8px;font-size:13px">
      <div><span class="role-badge role-admin">Quản trị hệ thống</span> — toàn quyền + quản lý người dùng.</div>
      <div><span class="role-badge role-dieuphoi">Điều phối / Trưởng bộ phận</span> — xem tất cả, phân công, phê duyệt phát sinh, xóa.</div>
      <div><span class="role-badge role-xuly">Nhân viên xử lý</span> — xem &amp; cập nhật ticket, ghi phát sinh (không phê duyệt/xóa).</div>
      <div><span class="role-badge role-yeucau">Người yêu cầu</span> — tạo &amp; xem ticket của phòng mình.</div>
      <div><span class="role-badge role-giamdoc">Ban giám đốc</span> — chỉ xem toàn bộ (không chỉnh sửa).</div>
    </div></div>`;
}
let EDITU=null,U_EDITING=false;
function openUser(username){
  const ex=username?USERS.find(u=>u.username===username):null;
  U_EDITING=!!ex;
  EDITU=ex?{username:ex.username,name:ex.name,role:ex.role,dept:ex.dept||"",password:""}:{username:"",name:"",role:"yeucau",dept:"",password:""};
  const roleOpts=Object.keys(ROLE_VI).map(r=>`<option value="${r}" ${r===EDITU.role?'selected':''}>${ROLE_VI[r]}</option>`).join("");
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:560px">
    <div class="modal-h"><h3>${U_EDITING?"Sửa người dùng "+esc(EDITU.username):"Thêm người dùng"}</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="form-grid">
      <div class="f"><label>Tên đăng nhập <span class="req">*</span></label><input value="${esc(EDITU.username)}" ${U_EDITING?'disabled style="background:#f0f4f2;color:var(--ink-3)"':''} oninput="EDITU.username=this.value"></div>
      <div class="f"><label>Họ tên</label><input value="${esc(EDITU.name)}" oninput="EDITU.name=this.value"></div>
      <div class="f"><label>Vai trò <span class="req">*</span></label><select onchange="EDITU.role=this.value">${roleOpts}</select></div>
      <div class="f"><label>Phòng ban</label><input value="${esc(EDITU.dept)}" placeholder="VD: P. Kinh doanh" oninput="EDITU.dept=this.value"></div>
      <div class="f full"><label>${U_EDITING?"Đặt lại mật khẩu (để trống nếu giữ nguyên)":"Mật khẩu"} ${U_EDITING?'':'<span class="req">*</span>'}</label><input type="text" value="" placeholder="Tối thiểu 8 ký tự, có chữ và số" oninput="EDITU.password=this.value"><div class="hint">Người dùng sẽ được yêu cầu đổi mật khẩu ở lần đăng nhập đầu.</div></div>
      ${EDITU.role==='yeucau'?'<div class="hint" style="grid-column:1/-1">Người yêu cầu chỉ thấy ticket có <b>Đơn vị</b> trùng phòng ban ở trên (hoặc do chính họ tạo).</div>':''}
    </div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveUser()">Lưu</button></div></div>`;
  document.getElementById("overlay").classList.add("show");
}
async function saveUser(){
  const u=EDITU;
  if(!U_EDITING){if(!u.username.trim()||!u.password){toast("Nhập tên đăng nhập và mật khẩu",true);return;}}
  if(u.password && !pwOk(u.password)){toast("Mật khẩu phải từ 8 ký tự, có cả chữ và số",true);return;}
  try{
    if(U_EDITING){await api("PUT","/api/users/"+encodeURIComponent(u.username),{name:u.name,role:u.role,dept:u.dept,password:u.password||undefined});}
    else{await api("POST","/api/users",u);}
    closeModal();renderUsers();toast("Đã lưu người dùng");
  }catch(e){toast(e.message||"Lỗi lưu",true);}
}
async function delUser(username){
  if(!confirm("Xóa tài khoản "+username+"?"))return;
  try{await api("DELETE","/api/users/"+encodeURIComponent(username));renderUsers();toast("Đã xóa tài khoản");}
  catch(e){toast(e.message||"Lỗi xóa",true);}
}

/* ============================ ĐĂNG NHẬP / ĐĂNG XUẤT ============================ */
function showLogin(){document.getElementById("login").classList.add("show");ME=null;}
function hideLogin(){document.getElementById("login").classList.remove("show");}
async function doLogin(ev){
  ev.preventDefault();
  const err=document.getElementById("loginErr");err.classList.remove("show");
  const username=document.getElementById("lgUser").value.trim();
  const password=document.getElementById("lgPass").value;
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
    const d=await r.json();
    if(!r.ok){err.textContent=d.error||"Đăng nhập thất bại";err.classList.add("show");return;}
    ME=d.user;CAP=d.cap;ROLELABEL=d.roleLabel;
    hideLogin();document.getElementById("lgPass").value="";
    await startApp();
    if(d.mustChange)setTimeout(()=>openChangePw(true),400);
  }catch(e){err.textContent="Không kết nối được máy chủ";err.classList.add("show");}
}
async function doLogout(){try{await fetch("/api/logout",{method:"POST"});}catch(e){}ME=null;CAP={};showLogin();}
let FORCE_PW=false;
function openChangePw(force){
  FORCE_PW=!!force;
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:460px">
    <div class="modal-h"><h3>Đổi mật khẩu</h3><div class="spacer"></div>${force?'':'<button class="x" onclick="closeModal()">✕</button>'}</div>
    <div class="modal-b">
      ${force?`<div class="login-err show" style="background:var(--amber-bg);color:#8a6500;margin-bottom:14px">Đây là lần đăng nhập đầu tiên — bạn cần đổi mật khẩu mặc định trước khi sử dụng hệ thống.</div>`:''}
      <div class="form-grid">
      <div class="f full"><label>Mật khẩu hiện tại</label><input id="cpOld" type="password" autocomplete="current-password"></div>
      <div class="f full"><label>Mật khẩu mới</label><input id="cpNew" type="password" autocomplete="new-password"><div class="hint">Tối thiểu 8 ký tự, có cả chữ và số.</div></div>
      <div class="f full"><label>Nhập lại mật khẩu mới</label><input id="cpNew2" type="password" autocomplete="new-password"></div>
    </div></div>
    <div class="modal-f">${force?'':'<button class="btn" onclick="closeModal()">Để sau</button>'}<button class="btn primary" onclick="saveChangePw()">Đổi mật khẩu</button></div></div>`;
  document.getElementById("overlay").classList.add("show");
}
function pwOk(p){return String(p).length>=8 && /[A-Za-z]/.test(p) && /[0-9]/.test(p);}
async function saveChangePw(){
  const o=document.getElementById("cpOld").value,n=document.getElementById("cpNew").value,n2=document.getElementById("cpNew2").value;
  if(!pwOk(n)){toast("Mật khẩu mới phải từ 8 ký tự, có cả chữ và số",true);return;}
  if(n!==n2){toast("Mật khẩu nhập lại không khớp",true);return;}
  try{await api("POST","/api/change-password",{oldPassword:o,newPassword:n});FORCE_PW=false;closeModal();toast("Đã đổi mật khẩu");}
  catch(e){toast(e.message||"Lỗi đổi mật khẩu",true);}
}

/* ============================ TỰ ĐỘNG ĐĂNG XUẤT ============================ */
const IDLE_MS=20*60*1000; // 20 phút không hoạt động
let idleTimer=null;
function resetIdle(){
  if(!ME)return;
  clearTimeout(idleTimer);
  idleTimer=setTimeout(async()=>{ if(!ME)return; toast("Đã tự đăng xuất do không hoạt động",true); await doLogout(); }, IDLE_MS);
}
["click","keydown","mousemove","scroll","touchstart"].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

/* ============================ INIT ============================ */
async function startApp(){
  try{await refresh();}catch(e){setOnline(false);return;}
  PAGE="dash";go("dash");setOnline(true);resetIdle();
}
let POLL_STARTED=false;
(async function init(){
  try{
    const r=await fetch("/api/me");
    if(!r.ok){showLogin();return;}
    const d=await r.json();ME=d.user;CAP=d.cap;ROLELABEL=d.roleLabel;
    await startApp();
    if(d.mustChange)setTimeout(()=>openChangePw(true),400);
  }catch(e){showLogin();}
  finally{if(!POLL_STARTED){POLL_STARTED=true;startPoll();}}
})();
</script>
