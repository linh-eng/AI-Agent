<title>Hỗ trợ THNG · Hệ thống quản lý nghiệp vụ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ============ THNG Support — green corporate theme ============ */
:root{
  --green-900:#081f38; --green-800:#0f3157; --green-700:#1b4f86; --green-600:#2563b8;
  --green-500:#2f6fd6; --green-400:#4f8ce8; --green-300:#a7c6ee; --green-50:#eaf1fc;
  --amber:#e0a400; --amber-bg:#fff6e0; --red:#d64545; --red-bg:#fdeaea;
  --blue:#2f6fd6; --blue-bg:#eaf1fd;
  --ink:#122019; --ink-2:#3f5349; --ink-3:#6b7d74; --line:#dbe7e0; --line-2:#eef4f0;
  --bg:#f4f8f6; --card:#ffffff; --shadow:0 1px 2px rgba(6,61,43,.06),0 8px 24px -12px rgba(6,61,43,.18);
  --radius:14px; --font:'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--green-700)}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--green-800),var(--green-900));color:#dbe9fb;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--green-400),var(--green-600));display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.brand .logo svg{width:24px;height:24px}
.brand b{font-size:16px;color:#fff;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--green-300);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#cfe0f5;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;transition:.15s}
.nav button svg{width:18px;height:18px;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav button .badge{margin-left:auto;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600}
.side-foot{margin-top:auto;font-size:11px;color:var(--green-300);padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:20px}
.topbar .sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.topbar .spacer{flex:1}
.content{padding:26px 28px 60px;max-width:1400px;width:100%}

/* buttons */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn:hover{border-color:var(--green-400);color:var(--green-700)}
.btn svg{width:16px;height:16px}
.btn.primary{background:linear-gradient(135deg,var(--green-600),var(--green-700));border-color:transparent;color:#fff;box-shadow:0 8px 18px -10px var(--green-700)}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--green-50)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}

/* cards & KPI */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lbl{color:var(--ink-3);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:8px;line-height:1}
.kpi .foot{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.kpi .spark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;position:absolute;right:16px;top:16px}
.kpi .spark svg{width:18px;height:18px}
.kpi.accent{background:linear-gradient(135deg,var(--green-700),var(--green-800));border-color:transparent;color:#fff}
.kpi.accent .lbl,.kpi.accent .foot{color:#bfe6d5}
.kpi.warn .val{color:var(--amber)} .kpi.bad .val{color:var(--red)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-h{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.panel-h h3{font-size:15px}
.panel-h .spacer{flex:1}
.panel-b{padding:18px 20px}

/* bar chart */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:180px 1fr 46px;align-items:center;gap:12px;font-size:13px}
.bar-row .track{background:var(--line-2);height:12px;border-radius:8px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--green-500),var(--green-700));transition:width .5s}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums}

/* table */
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{background:var(--green-50);color:var(--green-800);text-align:left;padding:11px 12px;font-weight:600;white-space:nowrap;position:sticky;top:0;border-bottom:1px solid var(--line)}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:var(--green-50)}
tbody tr{cursor:pointer}
.mono{font-variant-numeric:tabular-nums;font-weight:600;color:var(--green-800)}
.muted{color:var(--ink-3)}
.ell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.green{background:#e7f6ee;color:#1a7a4f} .pill.green .dot{background:#25a56a}
.pill.amber{background:var(--amber-bg);color:#8a6500} .pill.amber .dot{background:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)} .pill.red .dot{background:var(--red)}
.pill.blue{background:var(--blue-bg);color:var(--blue)} .pill.blue .dot{background:var(--blue)}
.pill.gray{background:#eef1f0;color:var(--ink-2)} .pill.gray .dot{background:var(--ink-3)}
.pr{font-weight:700}
.pr.P1{color:var(--red)} .pr.P2{color:#c07500} .pr.P3{color:var(--blue)} .pr.P4{color:var(--ink-3)}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.field-sel{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-2);font-weight:500}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-300);outline-offset:0;border-color:var(--green-400)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,61,43,.42);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:34px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:920px;box-shadow:0 30px 80px -20px rgba(6,61,43,.5);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:18px 24px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:14px;position:sticky;top:0;background:#fff;border-radius:18px 18px 0 0;z-index:2}
.modal-h h3{font-size:17px}
.modal-h .spacer{flex:1}
.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2)}
.x:hover{border-color:var(--red);color:var(--red)}
.modal-b{padding:22px 24px}
.modal-f{padding:16px 24px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 18px 18px}

/* form */
.steps{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.step{flex:1;min-width:130px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:12.5px;font-weight:600;color:var(--ink-3);display:flex;gap:9px;align-items:center;background:#fff;transition:.15s}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--line-2);color:var(--ink-2);display:grid;place-items:center;font-size:12px;flex:none}
.step.active{border-color:var(--green-500);color:var(--green-800);background:var(--green-50)}
.step.active .n{background:var(--green-600);color:#fff}
.fs{display:none} .fs.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.f textarea{resize:vertical;min-height:64px}
.hint{font-size:11.5px;color:var(--ink-3)}
.sec-title{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line-2)}
.sec-sub{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--green-800);margin-top:4px;padding:5px 10px;background:var(--green-50);border-radius:7px}
.readbox{grid-column:1/-1;background:var(--green-50);border:1px dashed var(--green-300);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--green-800);display:flex;gap:18px;flex-wrap:wrap}
.readbox b{color:var(--green-900)}

.dl{display:grid;grid-template-columns:200px 1fr;gap:0}
.dl dt{padding:9px 0;color:var(--ink-3);font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line-2)}
.dl dd{padding:9px 0;margin:0;border-bottom:1px solid var(--line-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:transparent;border:0;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;font-size:13.5px}
.tabs button.active{color:var(--green-700);border-bottom-color:var(--green-600)}
.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green-800);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:80;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.catcol{display:flex;flex-direction:column;gap:5px}
.catcol .h{font-weight:700;color:var(--green-800);font-size:13px;margin-bottom:4px}
.catcol .i{font-size:12.5px;color:var(--ink-2);padding:5px 10px;background:var(--green-50);border-radius:8px}
.catrow{display:flex;gap:6px;align-items:center}
.catrow input{flex:1;width:auto;min-width:0;font-size:12.5px;padding:5px 9px}
.xbtn{flex:none;width:26px;height:28px;border:1px solid var(--line);background:#fff;color:var(--red);border-radius:7px;cursor:pointer;font-size:16px;line-height:1;font-weight:700;padding:0}
.xbtn:hover{background:#fff0f0;border-color:var(--red)}
.addbtn{align-self:flex-start;margin-top:3px;border:1px dashed var(--green-700,#2f855a);background:var(--green-50);color:var(--green-800);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
.addbtn:hover{background:#e6f2ec}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rcard .rlb{font-size:12px;color:var(--ink-2);font-weight:600}
.rcard .rval{font-size:26px;font-weight:800;color:var(--green-800);margin-top:4px;line-height:1.1}
.rcard .rsub{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--green-700,#2f855a)}
.chip.on{background:var(--green-700,#2f855a);color:#fff;border-color:var(--green-700,#2f855a)}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{flex-direction:row;flex-wrap:wrap}.side-foot{display:none}.form-grid,.dl{grid-template-columns:1fr}}

/* ---- user area in sidebar ---- */
.userbox{margin-top:auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.userbox .who{display:flex;align-items:center;gap:10px}
.userbox .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--green-400),var(--green-600));display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.userbox .nm{color:#fff;font-weight:600;font-size:13px;line-height:1.2}
.userbox .rl{color:var(--green-300);font-size:11px;margin-top:2px}
.userbox .acts{display:flex;gap:6px}
.userbox button{flex:1;background:rgba(255,255,255,.09);border:0;color:#dbe9fb;padding:7px;border-radius:8px;font-size:12px;font-weight:600}
.userbox button:hover{background:rgba(255,255,255,.18);color:#fff}

/* ---- login screen ---- */
.login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 20% -10%,rgba(47,111,214,.28),transparent),linear-gradient(135deg,var(--green-900),#04162b)}
.login.show{display:flex}
.login-card{background:var(--card);border-radius:20px;box-shadow:0 40px 100px -20px rgba(0,0,0,.6);width:100%;max-width:400px;overflow:hidden}
.login-top{background:linear-gradient(135deg,var(--green-700),var(--green-800));padding:26px 28px;color:#fff;display:flex;align-items:center;gap:14px}
.login-top .logo{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.15);display:grid;place-items:center}
.login-top .logo svg{width:26px;height:26px}
.login-top b{font-size:18px;display:block;line-height:1.1}
.login-top span{font-size:11.5px;color:var(--green-300);letter-spacing:.06em;text-transform:uppercase}
.login-body{padding:26px 28px 22px}
.login-body h2{font-size:16px;margin-bottom:4px}
.login-body p{color:var(--ink-3);font-size:13px;margin:0 0 18px}
.login-body .f{margin-bottom:14px}
.login-err{background:var(--red-bg);color:var(--red);padding:9px 12px;border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:none}
.login-err.show{display:block}
.login-body .btn.primary{width:100%;justify-content:center;padding:11px}
.login-hint{margin-top:16px;font-size:11.5px;color:var(--ink-3);background:var(--green-50);border-radius:10px;padding:11px 13px;line-height:1.6}
.login-hint b{color:var(--green-800)}
.role-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.role-admin{background:#fdeaea;color:#b3341f} .role-dieuphoi{background:#eaf1fd;color:#2f6fd6}
.role-xuly{background:var(--green-50);color:var(--green-700)} .role-yeucau{background:#fff6e0;color:#8a6500} .role-giamdoc{background:#eef1f0;color:var(--ink-2)}

/* ---- action bar + lịch sử trạng thái ---- */
.actbar{margin:2px 0 16px;padding:12px 14px;background:var(--green-50);border:1px solid var(--line);border-radius:12px}
.actbar .lbl{font-size:12px;font-weight:700;color:var(--green-700);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px}
.actbar .row{display:flex;gap:8px;flex-wrap:wrap}
.histbox{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.hrow{position:relative;padding:8px 0}
.hrow .hdot{position:absolute;left:-21px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--green-500);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.qpart{background:var(--green-50);border-radius:8px;padding:6px 10px}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" fill="#fff" opacity=".95"/><path d="M9 12l2 2 4-4" stroke="#0f6e4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>Hỗ trợ THNG</b><span>Support Desk</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox" id="userbox"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">Dashboard điều hành</h1><div class="sub" id="pageSub">Tổng quan chỉ số nghiệp vụ hỗ trợ</div></div>
      <div class="spacer"></div>
      <span class="pill green" id="connDot"><span class="dot"></span>Đang kết nối…</span>
      <button class="btn" onclick="exportData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Xuất dữ liệu</button>
      <button class="btn primary" id="btnNewTop" onclick="openForm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>Tạo ticket</button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="overlay" id="overlay2" style="z-index:70"></div>
<div class="toast" id="toast"></div>

<div class="login" id="login">
  <div class="login-card">
    <div class="login-top">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" fill="#fff" opacity=".95"/><path d="M9 12l2 2 4-4" stroke="#0f6e4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>Hỗ trợ THNG</b><span>Support Desk</span></div>
    </div>
    <div class="login-body">
      <h2>Đăng nhập hệ thống</h2>
      <p>Vui lòng đăng nhập bằng tài khoản được cấp.</p>
      <div class="login-err" id="loginErr"></div>
      <form id="loginForm" onsubmit="doLogin(event)">

/* ============================ SLA / GIỜ LÀM VIỆC ============================ */
function workingHours(start,end){
  if(!start||!end) return null;
  let s=new Date(start), e=new Date(end); if(e<=s) return 0;
  let mins=0, cur=new Date(s);
  let guard=0;
  while(cur<e && guard++<200000){
    const day=cur.getDay(); // 0=CN,6=T7
    if((day>=1 && day<=5) || (day===6 && WORK.sat)){ // T2-T6 (+ T7 nếu cấu hình)
      mins+=segOverlap(cur,e,WORK.mStart,WORK.mEnd);
      mins+=segOverlap(cur,e,WORK.aStart,WORK.aEnd);
    }
    cur.setDate(cur.getDate()+1); cur.setHours(0,0,0,0);
  }
  return +(mins/60).toFixed(2);
}
function segOverlap(dayStart,end,h1,h2){
  const d=new Date(dayStart);
  const a=new Date(d); a.setHours(h1,0,0,0);
  const b=new Date(d); b.setHours(h2,0,0,0);
  const lo=Math.max(dayStart.getTime(),a.getTime());
  const hi=Math.min(end.getTime(),b.getTime());
  return hi>lo ? (hi-lo)/60000 : 0;
}
/* ---- Trạng thái & quy trình (v3) ---- */
function baseStatus(s){return String(s||"").replace(/^\d+\.\s*/,"").trim();}
function isClosed(s){const b=baseStatus(s);return b==="Hoàn tất"||b==="Từ chối";}
// Trạng thái đồng hồ SLA đang CHẠY (tích lũy thời gian xử lý)
function isRunning(s){return ["Đã tiếp nhận","Đang xử lý","Mở lại"].includes(baseStatus(s));}
// Trạng thái ĐANG DỪNG đồng hồ SLA (chờ/tạm dừng)
function isStopped(s){return ["Chờ phản hồi","Chờ duyệt","Tạm dừng","Trả lại bổ sung"].includes(baseStatus(s));}
// Trả về {pct, used, total, stopped, deadline, color, label} cho SLA xử lý — có dừng/chạy theo lịch sử
function slaStatus(t){
  const [,resH]=slaOf(t.uutien);
  const closed=isClosed(t.trangthai);
  const now=new Date().toISOString();
  const endTime=closed ? (t.tClose||t.tDone||now) : now;
  let used=0,total=0,stopped=0;
  const hist=Array.isArray(t.history)?t.history:null;
  if(hist && hist.length){
    let tiepNhanSeen=false;
    for(let i=0;i<hist.length;i++){
      const from=hist[i].at, to=(i+1<hist.length?hist[i+1].at:endTime), st=hist[i].to;
      const wh=workingHours(from,to)||0;
      if(isRunning(st)) used+=wh;
      if(baseStatus(st)==="Đã tiếp nhận") tiepNhanSeen=true;
      if(tiepNhanSeen) total+=wh;
    }
    stopped=+(total-used).toFixed(2); used=+used.toFixed(2); total=+total.toFixed(2);
  } else {
    // Ticket cũ chưa có lịch sử: tính đơn giản
    const start=t.tStart||t.tAssign||t.tCreate;
    used=workingHours(start, closed?(t.tDone||endTime):now)||0; total=used;
  }
  const pct=resH>0?used/resH:0;
  let color="green",label="Trong hạn";
  if(pct>1){color="red";label=closed?"Đã vi phạm SLA":"Đỏ - Vi phạm SLA";}
  else if(!closed && isStopped(t.trangthai)){color="gray";label="Tạm dừng SLA";}
  else if(pct>=WY_WARN){color="amber";label="Vàng - Sắp đến hạn";}
  else {color="green";label=closed?"Đạt SLA":"Trong hạn";}
  return {pct,used,total,stopped,deadline:resH,color,label};
}

/* ============================ ĐIỂM CHẤT LƯỢNG TỔNG HỢP (v3) ============================ */
// Trọng số điểm chất lượng — biến QCONF khai báo ở khối cấu hình phía trên (nạp từ máy chủ)
// SLA phản hồi đạt? = thời gian từ "Đã tiếp nhận" đến "Đang xử lý" đầu tiên ≤ SLA phản hồi
function responseMet(t){
  const [respMin]=slaOf(t.uutien);
  const hist=Array.isArray(t.history)?t.history:null; if(!hist) return true; // không đủ dữ liệu → coi như đạt
  let tiepAt=null,startAt=null;
  for(const h of hist){const b=baseStatus(h.to); if(b==="Đã tiếp nhận"&&!tiepAt)tiepAt=h.at; if(b==="Đang xử lý"&&tiepAt&&!startAt){startAt=h.at;break;}}
  if(!tiepAt||!startAt) return true;
  return (workingHours(tiepAt,startAt)||0)*60 <= respMin;
}
// Điểm chất lượng thực hiện (thang 100) — chỉ tính khi ticket đã đóng
function computeQuality(t){
  const s=slaStatus(t);
  const csat=+t.csat||0; const cCsat=(csat/5)*QCONF.csat;
  const respOk=responseMet(t), resOk=s.pct<=1;
  const metCnt=(respOk?1:0)+(resOk?1:0);
  const cSla=metCnt>=2?QCONF.sla:metCnt===1?QCONF.sla/2:0;
  let cSl=QCONF.sl;
  if(t.soluong && t.slThucte!=null && t.slThucte!==""){
    const plan=+t.soluong, act=+t.slThucte, diff=plan?Math.abs(act-plan)/plan:0;
    cSl = diff===0?QCONF.sl : diff<=0.05?+(QCONF.sl*10/15).toFixed(1) : 0;
  }
  const hasChuQuan=DB.ps.some(p=>p.ticketId===t.id && String(p.nhomNN||"").startsWith("Chủ quan"));
  const cPs=hasChuQuan?0:QCONF.ps;
  const cReopen=(+t.moLai>0)?0:QCONF.reopen;
  const total=Math.round(cCsat+cSla+cSl+cPs+cReopen);
  return {total, parts:{csat:+cCsat.toFixed(1),sla:cSla,sl:cSl,ps:cPs,reopen:cReopen}, respOk, resOk, hasChuQuan};
}

/* ---------- BÁO CÁO THEO CHU KỲ (9B) ---------- */
let RFILTER={preset:'thismonth',from:'',to:'',donvi:'',loai:'',luong:'',uutien:'',assignee:'',trangthai:''};
const PRESET=[['today','Hôm nay'],['yesterday','Hôm qua'],['thisweek','Tuần này'],['lastweek','Tuần trước'],['thismonth','Tháng này'],['lastmonth','Tháng trước'],['thisquarter','Quý này'],['thisyear','Năm nay'],['lastyear','Năm trước']];
function rangeOf(preset){
  const now=new Date(),y=now.getFullYear(),mo=now.getMonth(),d=now.getDate();
  const day=dt=>{const x=new Date(dt);x.setHours(0,0,0,0);return x;};
  const sow=dt=>{const x=day(dt);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x;};
  let a=null,b=null;
  if(preset==='today'){a=day(now);b=day(now);}
  else if(preset==='yesterday'){a=day(new Date(y,mo,d-1));b=a;}
  else if(preset==='thisweek'){a=sow(now);b=day(new Date(a.getFullYear(),a.getMonth(),a.getDate()+6));}
  else if(preset==='lastweek'){const s=sow(new Date(y,mo,d-7));a=s;b=day(new Date(s.getFullYear(),s.getMonth(),s.getDate()+6));}
  else if(preset==='thismonth'){a=day(new Date(y,mo,1));b=day(new Date(y,mo+1,0));}
  else if(preset==='lastmonth'){a=day(new Date(y,mo-1,1));b=day(new Date(y,mo,0));}
  else if(preset==='thisquarter'){const q=Math.floor(mo/3);a=day(new Date(y,q*3,1));b=day(new Date(y,q*3+3,0));}
  else if(preset==='thisyear'){a=day(new Date(y,0,1));b=day(new Date(y,11,31));}
  else if(preset==='lastyear'){a=day(new Date(y-1,0,1));b=day(new Date(y-1,11,31));}
  return {a,b};
}
function reportRange(){
  if(RFILTER.from||RFILTER.to){const a=RFILTER.from?new Date(RFILTER.from+'T00:00:00'):null;const b=RFILTER.to?new Date(RFILTER.to+'T23:59:59'):null;return {a,b,label:(RFILTER.from||'…')+' → '+(RFILTER.to||'…')};}
  const {a,b}=rangeOf(RFILTER.preset);if(b)b.setHours(23,59,59,999);const lb=(PRESET.find(x=>x[0]===RFILTER.preset)||[])[1]||'';return {a,b,label:lb};
}
function reportTickets(){
  const {a,b}=reportRange();
  return DB.tickets.filter(t=>{
    const dt=new Date(t.tCreate||(Array.isArray(t.history)&&t.history[0]&&t.history[0].at)||0);
    if(a&&dt<a)return false; if(b&&dt>b)return false;
    if(RFILTER.donvi&&t.donvi!==RFILTER.donvi)return false;
    if(RFILTER.loai&&t.loai!==RFILTER.loai)return false;
    if(RFILTER.luong&&t.luong!==RFILTER.luong)return false;
    if(RFILTER.uutien&&t.uutien!==RFILTER.uutien)return false;
    if(RFILTER.assignee&&String(t.assignee||'')!==RFILTER.assignee)return false;
    if(RFILTER.trangthai&&baseStatus(t.trangthai)!==RFILTER.trangthai)return false;
    return true;
  });
}
function reportMetrics(list){
  const done=list.filter(t=>baseStatus(t.trangthai)==='Hoàn tất').length;
  const rejected=list.filter(t=>baseStatus(t.trangthai)==='Từ chối').length;
  const open=list.filter(t=>!isClosed(t.trangthai)).length;
  const traLai=list.filter(t=>Array.isArray(t.history)&&t.history.some(h=>baseStatus(h.to)==='Trả lại bổ sung')).length;
  const moLai=list.filter(t=>+t.moLai>0).length;
  let respTot=0,respOk=0,resTot=0,resOk=0,viol=0,usedSum=0;
  list.forEach(t=>{const s=slaStatus(t);
    if(Array.isArray(t.history)&&t.history.some(h=>baseStatus(h.to)==='Đã tiếp nhận')){respTot++;if(responseMet(t))respOk++;}
    if(isClosed(t.trangthai)){resTot++;if(s.pct<=1)resOk++;else viol++;usedSum+=s.used;}
  });
  const closedList=list.filter(t=>isClosed(t.trangthai));
  const qArr=closedList.map(computeQuality);
  const qAvg=qArr.length?qArr.reduce((a,x)=>a+x.total,0)/qArr.length:0;
  const csatVals=list.map(t=>+t.csat||0).filter(x=>x>0);
  const csatAvg=csatVals.length?csatVals.reduce((a,x)=>a+x,0)/csatVals.length:0;
  const byPerson={};
  closedList.forEach(t=>{const p=String(t.assignee||'—').trim()||'—';(byPerson[p]=byPerson[p]||{n:0,q:0,csat:0,csatN:0});byPerson[p].n++;byPerson[p].q+=computeQuality(t).total;const c=+t.csat||0;if(c>0){byPerson[p].csat+=c;byPerson[p].csatN++;}});
  const tids=new Set(list.map(t=>t.id));
  const psList=DB.ps.filter(p=>tids.has(p.ticketId));
  const psNN={'Chủ quan':0,'Khách quan':0,'Do người yêu cầu':0};let cpDX=0,cpDuyet=0;
  psList.forEach(p=>{const nn=String(p.nhomNN||'');if(nn.startsWith('Chủ quan'))psNN['Chủ quan']++;else if(nn.startsWith('Khách quan'))psNN['Khách quan']++;else if(nn.startsWith('Do người'))psNN['Do người yêu cầu']++;cpDX+=+p.chiphiDX||0;cpDuyet+=+p.chiphiDuyet||0;});
  const conflict=list.filter(t=>Array.isArray(t.priHistory)&&t.priHistory.length).length;
  return {tong:list.length,done,rejected,open,traLai,moLai,
    respRate:respTot?Math.round(respOk/respTot*100):null,resRate:resTot?Math.round(resOk/resTot*100):null,viol,tbXuLy:resTot?+(usedSum/resTot).toFixed(1):0,
    qAvg:Math.round(qAvg),csatAvg:+csatAvg.toFixed(2),byPerson,psTong:psList.length,psNN,cpDX,cpDuyet,conflict};
}

  document.getElementById("view").innerHTML=`

async function saveProjects(){

  const codes=list.map(p=>p.ma).filter(Boolean); if(new Set(codes).size!==codes.length){ toast('Mã dự án bị trùng',true); return; }
  try{ await api('PUT','/api/projects',list); await refreshProjects(); EDITPROJ=JSON.parse(JSON.stringify(PROJECTS)); toast('Đã lưu danh mục dự án'); renderCat(true); }
  catch(e){ toast(e.message||'Lỗi lưu dự án',true); }

function cfgSet(path,val){
  if(path==='warn%'){ EDITCFG.warn=(+val||0)/100; return; }
  if(path==='overload'){ EDITCFG.overload=+val||0; return; }
  if(path==='maxUpload'){ EDITCFG.maxUpload=Math.max(1,+val||10); return; }
  const parts=path.split('.');
  if(parts[0]==='sla'){ EDITCFG.sla[parts[1]][+parts[2]]=+val||0; return; }
  if(parts[0]==='work'){ if(parts[1]==='sat')EDITCFG.work.sat=!!val; else EDITCFG.work[parts[1]]=+val||0; return; }
  if(parts[0]==='quality'){ EDITCFG.quality[parts[1]]=+val||0; const q=EDITCFG.quality,s=q.csat+q.sla+q.sl+q.ps+q.reopen,el=document.getElementById('qsum'); if(el){el.textContent=s;el.parentElement.style.color=s===100?'var(--green)':'var(--red)';} return; }
}
async function saveConfig(){
  // dọn danh mục: bỏ mục trống, bỏ loại công việc thiếu mã hoặc tên
  if(EDITCFG.cat){ Object.keys(EDITCFG.cat).forEach(k=>{ if(Array.isArray(EDITCFG.cat[k])) EDITCFG.cat[k]=EDITCFG.cat[k].map(x=>(x||'').trim()).filter(Boolean); }); }
  if(Array.isArray(EDITCFG.worktypes)) EDITCFG.worktypes=EDITCFG.worktypes.map(w=>w.map(x=>(x||'').toString().trim())).filter(w=>w[0]&&w[1]);
  const qs=EDITCFG.quality; if(qs){ const s=qs.csat+qs.sla+qs.sl+qs.ps+qs.reopen; if(s!==100 && !confirm('Tổng trọng số điểm chất lượng đang là '+s+' (khác 100). Vẫn lưu?')) return; }
  try{ await api('PUT','/api/config',EDITCFG); applyConfig(EDITCFG); toast('Đã lưu cấu hình & danh mục — áp dụng ngay'); render(); }
  catch(e){ toast(e.message||'Lỗi lưu cấu hình',true); }
}

let FILECACHE={};
function attachListHTML(tid){ const list=FILECACHE[tid]||[];
  if(!list.length) return `<div class="muted" style="font-size:12.5px">Chưa có tệp đính kèm.</div>`;
  return `<div style="display:flex;flex-direction:column;gap:6px">${list.map(f=>`<div class="catrow" style="justify-content:space-between;background:var(--green-50);border-radius:8px;padding:6px 10px">

    ${can('edit')?`<button class="xbtn" title="Xóa" onclick="deleteFile('${f.id}','${tid}')">×</button>`:''}</div>`).join("")}</div>`; }
function fmtSize(n){ n=+n||0; return n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'; }
async function loadFiles(tid){ try{ FILECACHE[tid]=await api('GET','/api/files?ticketId='+encodeURIComponent(tid)); }catch(e){ FILECACHE[tid]=[]; } }
async function uploadFiles(tid){ const inp=document.getElementById('attachInput'); if(!inp||!inp.files.length)return;
  const maxMB=(CFG&&CFG.maxUpload)||10;
  for(const file of inp.files){
    if(file.size>maxMB*1048576){ toast(`"${file.name}" vượt ${maxMB} MB`,true); continue; }
    try{ const b64=await fileToB64(file);
      await api('POST','/api/upload',{ticketId:tid,name:file.name,mime:file.type||'application/octet-stream',dataB64:b64});
    }catch(e){ toast('Lỗi tải "'+file.name+'": '+(e.message||''),true); }
  }
  inp.value=''; await loadFiles(tid); const box=document.getElementById('attachBox'); if(box){ box.innerHTML=attachListHTML(tid)+`<div style="margin-top:8px"><input type="file" id="attachInput" multiple style="width:auto;flex:none;font-size:13px" onchange="uploadFiles('${tid}')"> <span class="muted" style="font-size:12px">Ảnh, PDF, Word, Excel… tối đa ${maxMB} MB/tệp.</span></div>`; }
  toast('Đã tải tệp lên'); }
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const s=String(r.result); res(s.slice(s.indexOf(',')+1)); }; r.onerror=rej; r.readAsDataURL(file); }); }
async function deleteFile(id,tid){ if(!confirm('Xóa tệp này?'))return; try{ await api('DELETE','/api/file/'+id); await loadFiles(tid); const box=document.getElementById('attachBox'); const maxMB=(CFG&&CFG.maxUpload)||10; if(box){ box.innerHTML=attachListHTML(tid)+`<div style="margin-top:8px"><input type="file" id="attachInput" multiple style="width:auto;flex:none;font-size:13px" onchange="uploadFiles('${tid}')"> <span class="muted" style="font-size:12px">Ảnh, PDF, Word, Excel… tối đa ${maxMB} MB/tệp.</span></div>`; } toast('Đã xóa tệp'); }catch(e){ toast('Lỗi xóa tệp',true); } }
async function saveTicket(){
  const t=EDIT;
  if(!t.loai){toast("Vui lòng chọn Loại công việc",true);FSTEP=0;drawForm();return;}
  if(isKhac(t.loai) && String(t.loaiKhac||'').trim().length<5){toast("Với loại 'Khác', vui lòng ghi rõ loại công việc (tối thiểu 5 ký tự)",true);FSTEP=0;drawForm();return;}
  if(!t.nguoiYC||!t.noidung){toast("Vui lòng nhập Người yêu cầu và Nội dung",true);FSTEP=0;drawForm();return;}
  const isNew=!DB.tickets.some(x=>x.id===t.id);

  }catch(e){toast("Lỗi lưu (kiểm tra kết nối máy chủ)",true);}

  const addPsBtn=can('ps')?`<button class="btn sm" style="margin-top:14px" onclick="openPS('${id}')">+ Ghi nhận phát sinh</button>`:'';
  const psTab=ps.length?`<div class="table-wrap"><table><thead><tr><th>Mã PS</th><th>Loại</th><th>Mô tả</th><th>CP đề xuất</th><th>Duyệt</th></tr></thead>
    <tbody>${ps.map(psRow).join("")}</tbody></table></div>${addPsBtn}${can('approve')?'<div class="hint" style="margin-top:8px">Nhấp vào dòng phát sinh để phê duyệt / cập nhật.</div>':''}`
    :`<div class="empty" style="padding:34px"><div>Ticket chưa có phát sinh.</div>${addPsBtn}</div>`;

  const priHist=Array.isArray(t.priHistory)?t.priHistory:[];
  const priTab = priHist.length
    ? `<div class="histbox">${priHist.slice().reverse().map(h=>`<div class="hrow"><div class="hdot" style="background:var(--amber)"></div><div><b>Phương án ${h.option}</b> <span class="muted" style="font-size:12.5px">· ${fmtDT(h.at)}${h.by?" · "+esc(h.by):""}</span>${h.ketQua?`<div style="font-size:12.5px">${esc(h.ketQua)}</div>`:''}${h.reason?`<div class="muted" style="font-size:12.5px">Lý do: ${esc(h.reason)}</div>`:''}</div></div>`).join("")}</div>`
    : `<div class="empty" style="padding:34px"><div>Chưa ghi nhận xung đột ưu tiên nào cho ticket này.</div></div>`;
  const audit=Array.isArray(t.auditLog)?t.auditLog:[];
  const auditTab = audit.length
    ? `<div class="histbox">${audit.slice().reverse().map(a=>`<div class="hrow"><div class="hdot" style="background:var(--blue)"></div><div><span class="muted" style="font-size:12.5px">${fmtDT(a.at)}${a.by?" · "+esc(a.by):""}</span>${a.changes.map(c=>`<div style="font-size:12.5px">${esc(c.field)}: <span class="muted">${esc(c.from||'(trống)')}</span> → <b>${esc(c.to||'(trống)')}</b></div>`).join("")}${a.note?`<div class="muted" style="font-size:12px">Lý do: ${esc(a.note)}</div>`:''}</div></div>`).join("")}</div>`
    : `<div class="empty" style="padding:34px"><div>Chưa ghi nhận thay đổi trường nào.</div></div>`;
  const acts=nextActions(t).filter(actionAllowed); window.__acts=acts;
  const actionsBar = acts.length
    ? `<div class="actbar"><div class="lbl">Hành động tiếp theo</div><div class="row">${acts.map((a,i)=>`<button class="btn ${i===0?'primary':''} sm" onclick="doAction('${id}',${i})">${esc(a.label)}</button>`).join("")}</div></div>`
    : (isClosed(t.trangthai)?`<div class="hint" style="margin:2px 0 14px">Ticket đã đóng — không còn thao tác chuyển trạng thái.</div>`:'');
  document.getElementById("overlay").innerHTML=`<div class="modal">
    <div class="modal-h"><h3 class="mono" style="color:var(--green-800)">${esc(t.id)}</h3>
      <span class="pill ${s.color}"><span class="dot"></span>${s.label}</span>${stPill(t.trangthai)}
      <div class="spacer"></div><button class="btn sm" onclick="printMenu('${id}')">🖨️ In phiếu</button>${can('edit')?`<button class="btn sm" onclick="openNotify('${id}')">📨 Gửi thông báo${notiPending(t)?' <span style="color:#ffd21e">●</span>':''}</button>`:''}${can('edit')?`<button class="btn sm" onclick="openForm('${t.id}')">Chỉnh sửa</button>`:''}<button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      ${actionsBar}
      <div class="tabs">
        <button class="${TAB==='info'?'active':''}" onclick="openDetail('${id}','info')">Thông tin chung</button>
        <button class="${TAB==='proc'?'active':''}" onclick="openDetail('${id}','proc')">Xử lý & SLA</button>
        <button class="${TAB==='ps'?'active':''}" onclick="openDetail('${id}','ps')">Phát sinh (${ps.length})</button>
        <button class="${TAB==='pri'?'active':''}" onclick="openDetail('${id}','pri')">Lịch sử ưu tiên (${priHist.length})</button>
        <button class="${TAB==='audit'?'active':''}" onclick="openDetail('${id}','audit')">Nhật ký thay đổi (${audit.length})</button>
      </div>
      ${TAB==='info'?info:TAB==='proc'?proc:TAB==='pri'?priTab:TAB==='audit'?auditTab:psTab}
    </div></div>`;
  document.getElementById("overlay").classList.add("show");
}

/* ============================ HÀNH ĐỘNG QUY TRÌNH (v3) ============================ */
function nextActions(t){
  const s=baseStatus(t.trangthai); const A=[];
  const add=(to,label,need,cap)=>A.push({to,label,need:!!need,cap:cap||'edit'});
  if(s==='Tạo mới'){ add('Đã tiếp nhận','Tiếp nhận (đủ điều kiện)',false,'edit'); add('Trả lại bổ sung','Trả lại bổ sung',true,'edit'); add('Từ chối','Từ chối',true,'edit'); }
  else if(s==='Trả lại bổ sung'){ add('Tạo mới','Gửi lại (đã bổ sung)',false,'create'); }
  else if(s==='Đã tiếp nhận'){ add('@assign','Phân công người thực hiện',false,'edit'); add('@plan','Lập kế hoạch thực hiện',false,'edit'); add('Đang xử lý','Bắt đầu xử lý',false,'edit'); add('Từ chối','Từ chối',true,'edit'); }
  else if(s==='Đang xử lý'){ add('Đã xử lý','Hoàn thành xử lý',false,'edit'); add('Chờ phản hồi','Chờ phản hồi NYC',false,'edit'); add('Chờ duyệt','Chờ duyệt phát sinh',false,'edit'); add('Tạm dừng','Tạm dừng',true,'edit'); }
  else if(s==='Chờ phản hồi'||s==='Chờ duyệt'){ add('Đang xử lý','Tiếp tục xử lý',false,'edit'); }
  else if(s==='Tạm dừng'){ add('Đang xử lý','Tiếp tục xử lý',false,'edit'); add('Đã tiếp nhận','Phân loại lại (Bước 2)',true,'edit'); }
  else if(s==='Đã xử lý'){ add('Hoàn tất','Nghiệm thu đạt → Hoàn tất',false,'edit'); add('Mở lại','Mở lại (chưa đạt)',true,'edit'); }
  else if(s==='Mở lại'){ add('Đang xử lý','Tiếp tục xử lý',false,'edit'); }
  else if(s==='Hoàn tất'){ add('Mở lại','Mở lại',true,'edit'); }
  return A;
}
function actionAllowed(a){ return a.cap==='create' ? can('create') : can(a.cap); }
function doAction(id, idx){
  const a=(window.__acts||[])[idx]; if(!a)return;
  const t=DB.tickets.find(x=>x.id===id); if(!t)return; const to=a.to;
  if(to==='@assign'){ openAssign(id); return; }
  if(to==='@plan'){ openPlan(id); return; }
  // Bước 2 — tiếp nhận: mở hộp chốt ưu tiên
  if(baseStatus(to)==='Đã tiếp nhận' && baseStatus(t.trangthai)==='Tạo mới'){ openReceive(id); return; }
  // Cổng Bước 3: phải có Người thực hiện + kế hoạch đã xác nhận + trường 5H bắt buộc trước khi Đang xử lý
  if(baseStatus(t.trangthai)==='Đã tiếp nhận' && baseStatus(to)==='Đang xử lý'){
    if(!(t.assignee&&String(t.assignee).trim())){ toast('Cần phân công Người thực hiện trước khi bắt đầu xử lý',true); return; }
    if(!(t.keHoach&&t.keHoach.confirmed)){ toast('Cần lập & xác nhận kế hoạch thực hiện trước khi bắt đầu xử lý',true); openPlan(id); return; }
    const miss=missing5H(t);
    if(miss.length){ showMissing5H(id,miss); return; }
  }
  if(a.need){ askReason(a.label,(reason)=>applyStatus(id,to,reason,{})); return; }
  applyStatus(id,to,'',{});
}
function showMissing5H(id,miss){
  document.getElementById("overlay2").innerHTML=`<div class="modal" style="max-width:520px">
    <div class="modal-h"><h3>Chưa đủ thông tin dự án & triển khai (5H)</h3><div class="spacer"></div><button class="x" onclick="closeQuickProject()">✕</button></div>
    <div class="modal-b"><div class="warn" style="margin-bottom:12px">Không thể bắt đầu xử lý vì còn thiếu các trường bắt buộc để đội triển khai ra hiện trường:</div>
      <ul style="margin:0 0 6px 18px;line-height:1.9;font-size:13.5px">${miss.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="hint">Hãy bổ sung trực tiếp, hoặc gửi thông báo yêu cầu người yêu cầu bổ sung.</div></div>
    <div class="modal-f"><button class="btn" onclick="closeQuickProject();openNotify('${id}')">📨 Gửi yêu cầu bổ sung</button><div style="flex:1"></div><button class="btn primary" onclick="closeQuickProject();openForm('${id}')">Bổ sung ngay</button></div></div>`;
  document.getElementById("overlay2").classList.add("show");
}
async function applyStatus(id,to,reason,extra){
  const src=DB.tickets.find(x=>x.id===id); if(!src)return;
  const t=JSON.parse(JSON.stringify(src));
  t.trangthai=to; t._reason=reason||'';
  if(baseStatus(to)==='Mở lại') t.moLai=(+t.moLai||0)+1;
  if(baseStatus(to)==='Hoàn tất' && !t.tClose) t.tClose=new Date().toISOString().slice(0,16);
  if(baseStatus(to)==='Đã xử lý' && !t.tDone) t.tDone=new Date().toISOString().slice(0,16);
  Object.assign(t, extra||{});
  try{ await api('PUT','/api/tickets/'+encodeURIComponent(id),t); await refresh(); buildNav(); render(); openDetail(id,'proc'); toast('Đã cập nhật: '+baseStatus(to)); }
  catch(e){ toast(e.message||'Lỗi cập nhật',true); }
}
function askReason(title,cb){
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:480px">
    <div class="modal-h"><h3>${esc(title)}</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="f"><label>Lý do <span class="req">*</span></label><textarea id="rsReason" placeholder="Nhập lý do (tối thiểu 5 ký tự)…" style="min-height:90px"></textarea><div class="hint">Bắt buộc ghi lý do — lưu vào lịch sử ticket, không xóa vết.</div></div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" id="rsOk">Xác nhận</button></div></div>`;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("rsOk").onclick=()=>{const v=document.getElementById("rsReason").value.trim(); if(v.length<5){toast('Vui lòng ghi lý do (tối thiểu 5 ký tự)',true);return;} cb(v);};
}
function priNum(x){const m=String(x).match(/P(\d)/);return m?+m[1]:3;}
function openReceive(id){
  const t=DB.tickets.find(x=>x.id===id); if(!t)return;
  const deXuat=t.uutienDeXuat||t.uutien;
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:520px">
    <div class="modal-h"><h3>Tiếp nhận & phân loại</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <div class="hint" style="margin-bottom:12px">Mức ưu tiên người yêu cầu đề xuất: <b>${esc(deXuat)}</b></div>
      <div class="f"><label>Mức ưu tiên chính thức <span class="req">*</span></label><select id="rcPri">${CAT.uutien.map(x=>`<option ${x===t.uutien?'selected':''}>${esc(x)}</option>`).join("")}</select></div>
      <div class="f" style="margin-top:12px"><label>Lý do</label><textarea id="rcReason" placeholder="VD: yêu cầu không gấp, có thể xếp lịch…" style="min-height:70px"></textarea></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" id="rcOk">Xác nhận tiếp nhận</button></div></div>`;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("rcOk").onclick=()=>{
    const pri=document.getElementById("rcPri").value; const reason=document.getElementById("rcReason").value.trim();
    if(priNum(pri)>priNum(deXuat) && reason.length<5){ toast('Hạ cấp ưu tiên: vui lòng ghi lý do (tối thiểu 5 ký tự)',true); return; }
    applyStatus(id,'Đã tiếp nhận', reason||('Tiếp nhận, chốt '+pri), {uutien:pri});
  };
}

/* ============================ KẾ HOẠCH THỰC HIỆN (v3 mục 5E) ============================ */
let EDITPLAN=null, EDITPLAN_ID=null;
function openPlan(id){
  const t=DB.tickets.find(x=>x.id===id); if(!t)return; EDITPLAN_ID=id;
  const k=t.keHoach||{};
  EDITPLAN={tBatDauDK:k.tBatDauDK||'',tHoanTatDK:k.tHoanTatDK||'',phuongAn:k.phuongAn||'',checklist:Array.isArray(k.checklist)?JSON.parse(JSON.stringify(k.checklist)):[],ruiRo:k.ruiRo||'',duPhong:k.duPhong||'',dieuKien:k.dieuKien||'',ghiChuNYC:k.ghiChuNYC||'',lyDoTre:k.lyDoTre||'',camKet:!!k.confirmed};
  drawPlan();
}
function planAddItem(){ EDITPLAN.checklist.push({text:'',done:false}); drawPlan(); }
function planDelItem(i){ EDITPLAN.checklist.splice(i,1); drawPlan(); }
function drawPlan(){
  const k=EDITPLAN;
  const cl=k.checklist.map((c,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
    <input type="checkbox" style="width:auto;flex:none" ${c.done?'checked':''} onchange="EDITPLAN.checklist[${i}].done=this.checked">
    <input type="text" value="${esc(c.text)}" oninput="EDITPLAN.checklist[${i}].text=this.value" placeholder="Nhập đầu việc con…" style="flex:1;width:auto;min-width:0">
    <button type="button" class="btn sm danger" style="flex:none" onclick="planDelItem(${i})">✕</button></div>`).join("");
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:640px">
    <div class="modal-h"><h3>Lập kế hoạch thực hiện</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="form-grid">
      <div class="sec-title">Thời gian</div>
      <div class="f"><label>Bắt đầu dự kiến</label><input type="datetime-local" value="${esc(k.tBatDauDK)}" oninput="EDITPLAN.tBatDauDK=this.value"></div>
      <div class="f"><label>Hoàn tất dự kiến</label><input type="datetime-local" value="${esc(k.tHoanTatDK)}" oninput="EDITPLAN.tHoanTatDK=this.value"></div>
      <div class="sec-title">Cách làm</div>
      <div class="f full"><label>Phương án thực hiện</label><textarea oninput="EDITPLAN.phuongAn=this.value" placeholder="Mô tả cách triển khai…">${esc(k.phuongAn)}</textarea></div>
      <div class="f full"><label>Các đầu việc con</label>${cl||'<div class="hint">Chưa có đầu việc con.</div>'}<button class="btn sm" style="margin-top:6px" onclick="planAddItem()">+ Thêm đầu việc</button></div>
      <div class="sec-title">Rủi ro & điều kiện</div>
      <div class="f full"><label>Rủi ro nhận diện trước</label><textarea oninput="EDITPLAN.ruiRo=this.value">${esc(k.ruiRo)}</textarea></div>
      <div class="f full"><label>Phương án dự phòng</label><textarea oninput="EDITPLAN.duPhong=this.value">${esc(k.duPhong)}</textarea></div>
      <div class="f full"><label>Điều kiện tiên quyết</label><textarea oninput="EDITPLAN.dieuKien=this.value">${esc(k.dieuKien)}</textarea></div>
      <div class="f full"><label>Ghi chú gửi người yêu cầu</label><textarea oninput="EDITPLAN.ghiChuNYC=this.value">${esc(k.ghiChuNYC)}</textarea></div>
      <div class="f full" id="lyDoTreWrap" style="display:none"><label>Lý do hoàn tất trễ hơn thời hạn mong muốn <span class="req">*</span></label><textarea id="planLyDoTre" oninput="EDITPLAN.lyDoTre=this.value" placeholder="Bắt buộc ghi lý do…">${esc(k.lyDoTre)}</textarea></div>
      <div class="f full"><label style="display:flex;gap:9px;align-items:center;cursor:pointer"><input type="checkbox" id="planCamKet" style="width:auto;flex:none" ${k.camKet?'checked':''} onchange="EDITPLAN.camKet=this.checked"> <span><b>Người thực hiện xác nhận nhận việc</b> — bắt buộc để bắt đầu xử lý</span></label></div>
    </div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="savePlan()">Lưu kế hoạch</button></div></div>`;
  document.getElementById("overlay").classList.add("show");
}
async function savePlan(){
  const k=EDITPLAN, id=EDITPLAN_ID, t=DB.tickets.find(x=>x.id===id); if(!t)return;
  // Cảnh báo trễ so với thời hạn mong muốn của người yêu cầu
  const tre = k.tHoanTatDK && t.tGiaoYC && new Date(k.tHoanTatDK) > new Date(t.tGiaoYC);
  if(tre && String(k.lyDoTre||'').trim().length<5){
    const w=document.getElementById("lyDoTreWrap"); if(w){w.style.display='block';}
    toast('Kế hoạch hoàn tất trễ hơn thời hạn mong muốn — vui lòng ghi lý do',true); return;
  }
  const keHoach={tBatDauDK:k.tBatDauDK,tHoanTatDK:k.tHoanTatDK,phuongAn:k.phuongAn,checklist:k.checklist,ruiRo:k.ruiRo,duPhong:k.duPhong,dieuKien:k.dieuKien,ghiChuNYC:k.ghiChuNYC,lyDoTre:k.lyDoTre,confirmed:!!k.camKet};
  const nt=JSON.parse(JSON.stringify(t)); nt.keHoach=keHoach;
  try{ await api('PUT','/api/tickets/'+encodeURIComponent(id),nt); await refresh(); buildNav(); render(); openDetail(id,'proc'); toast(keHoach.confirmed?'Đã lưu & xác nhận kế hoạch':'Đã lưu kế hoạch (chưa xác nhận nhận việc)'); }
  catch(e){ toast(e.message||'Lỗi lưu kế hoạch',true); }
}
function planProgress(t){ const c=t.keHoach&&Array.isArray(t.keHoach.checklist)?t.keHoach.checklist:[]; if(!c.length)return null; const done=c.filter(x=>x.done).length; return {done,total:c.length,pct:Math.round(done/c.length*100)}; }

/* ============================ PHÂN CÔNG & XUNG ĐỘT ƯU TIÊN (v3 mục 3) ============================ */
// OVERLOAD_N khai báo ở khối cấu hình phía trên (nạp từ máy chủ)
function openTicketsOf(name,excludeId){ return DB.tickets.filter(x=>String(x.assignee||"").trim()===String(name).trim() && !isClosed(x.trangthai) && x.id!==excludeId); }
function slaRemainHtml(t){ const s=slaStatus(t); const left=+(s.deadline-s.used).toFixed(1); return `<span class="pill ${s.color}"><span class="dot"></span>${left>=0?('còn '+left+'h'):('trễ '+Math.abs(left)+'h')}</span>`; }
function openAssign(id){
  const t=DB.tickets.find(x=>x.id===id); if(!t)return;
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:520px">
    <div class="modal-h"><h3>Phân công người thực hiện</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="f"><label>Người thực hiện <span class="req">*</span></label><input id="asgName" value="${esc(t.assignee||'')}" placeholder="Nhập tên người thực hiện"></div>
      <div class="hint" style="margin-top:8px">Hệ thống sẽ kiểm tra xung đột mức độ ưu tiên & quá tải trước khi giao việc.</div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" id="asgOk">Kiểm tra & phân công</button></div></div>`;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("asgOk").onclick=()=>{ const name=document.getElementById("asgName").value.trim(); if(!name){toast('Nhập tên người thực hiện',true);return;} checkConflict(id,name); };
}
function checkConflict(id,name){
  const t=DB.tickets.find(x=>x.id===id);
  const open=openTicketsOf(name,id);
  const condA = priNum(t.uutien)===1 && open.some(x=>priNum(x.uutien)===1);
  const condB = open.filter(x=>priNum(x.uutien)<=2).length>=OVERLOAD_N;
  if(condA||condB) showConflict(id,name,open,condA,condB);
  else assignTo(id,name,{},null,'Phân công (không xung đột)');
}
async function assignTo(id,name,extra,priLog){
  const src=DB.tickets.find(x=>x.id===id); if(!src)return;
  const t=JSON.parse(JSON.stringify(src)); t.assignee=name;

/* ============================ BỘ TẠO FILE EXCEL (.xlsx) — không phụ thuộc thư viện ============================ */
// CRC32 cho ZIP
function crc32(bytes){ let t=crc32._t; if(!t){ t=crc32._t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } }
  let crc=0xFFFFFFFF; for(let i=0;i<bytes.length;i++) crc=(crc>>>8)^t[(crc^bytes[i])&0xFF]; return (crc^0xFFFFFFFF)>>>0; }
// ZIP "store" (không nén) — đủ để tạo .xlsx hợp lệ
function zipStore(files){
  const u16=n=>[n&0xFF,(n>>8)&0xFF], u32=n=>[n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF];
  const enc=new TextEncoder(), parts=[], central=[]; let off=0; const D=21025, T=0; // 2021-01-01
  for(const f of files){
    const nb=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(T),u16(D),u32(crc),u32(data.length),u32(data.length),u16(nb.length),u16(0));
    parts.push(new Uint8Array(lh),nb,data);
    central.push({nb,crc,size:data.length,off}); off+=lh.length+nb.length+data.length;
  }
  const cdStart=off, cd=[];
  for(const c of central){
    const ch=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(T),u16(D),u32(c.crc),u32(c.size),u32(c.size),u16(c.nb.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
    cd.push(new Uint8Array(ch),c.nb); off+=ch.length+c.nb.length;
  }
  const eocd=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(central.length),u16(central.length),u32(off-cdStart),u32(cdStart),u16(0)));
  return new Blob([...parts,...cd,eocd],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
// Tạo Blob .xlsx từ danh sách sheet: [{name, rows:[[cell,...],...], header?}]
function xlsxBlob(sheets){
  const enc=new TextEncoder(), E=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const col=i=>{ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-1-m)/26; } return s; };
  const files=[];

  sheets.forEach((s,i)=>ct+=`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
  ct+='</Types>';
  files.push({name:'[Content_Types].xml',data:enc.encode(ct)});
  files.push({name:'_rels/.rels',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
  let wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
  sheets.forEach((s,i)=>wb+=`<sheet name="${E(s.name).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`);
  wb+='</sheets></workbook>'; files.push({name:'xl/workbook.xml',data:enc.encode(wb)});
  let wr='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  sheets.forEach((s,i)=>wr+=`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`);
  wr+=`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  files.push({name:'xl/_rels/workbook.xml.rels',data:enc.encode(wr)});
  files.push({name:'xl/styles.xml',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>')});
  sheets.forEach((s,si)=>{
    let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    (s.rows||[]).forEach((row,ri)=>{
      x+=`<row r="${ri+1}">`;
      row.forEach((cell,ci)=>{
        const ref=col(ci)+(ri+1), bold=(ri===0&&s.header!==false)?' s="1"':'';
        if(typeof cell==='number'&&isFinite(cell)) x+=`<c r="${ref}"${bold}><v>${cell}</v></c>`;
        else x+=`<c r="${ref}"${bold} t="inlineStr"><is><t xml:space="preserve">${E(cell)}</t></is></c>`;
      });
      x+='</row>';
    });
    x+='</sheetData></worksheet>'; files.push({name:`xl/worksheets/sheet${si+1}.xml`,data:enc.encode(x)});
  });
  return zipStore(files);
}

    .doc{max-width:190mm;margin:0 auto}
    .hd{text-align:center;border-bottom:2px solid #2f855a;padding-bottom:8px;margin-bottom:14px}

    .sign{display:flex;justify-content:space-around;margin-top:34px;text-align:center} .sign>div{width:44%}
    .sign .r{font-weight:700} .sign .s{font-style:italic;color:#666;font-size:11px} .sign .sp{height:64px}
    .muted{color:#777} .note{font-size:11px;color:#666;margin-top:4px}
    @media print{.noprint{display:none}}

    ['Số lượng KH → thực tế',[t.soluong,t.slThucte].filter(x=>x!=null&&x!=='').join(' → ')],['Địa điểm thực tế',t.diadiemThucte],['Người nhận / ký',t.nguoiNhan],
    ['Kết quả nghiệm thu',t.nghiemthu],['TG hoàn tất',fmtDT(t.tDone)],['Ngày đóng',fmtDT(t.tClose)],
    ['CSAT',t.csat?('★'.repeat(+t.csat)+' ('+t.csat+'/5)'):''],['Điểm chất lượng',q?q.total+'/100':'(chưa đóng)'],['Số lần mở lại',t.moLai]
  ])+`<h3>Việc đã thực hiện</h3><div style="border:1px solid #ccc;padding:8px;min-height:44px">${xmlEsc(t.dathuchien)}</div>
  <h3>Đề xuất / Nhận xét</h3><div style="border:1px solid #ccc;padding:8px;min-height:40px">${xmlEsc([t.dexuat,t.nhanxet].filter(Boolean).join(' — '))}</div>`
  +signBlock("NGƯỜI YÊU CẦU (nghiệm thu)","NGƯỜI THỰC HIỆN");

}
// 5) Báo cáo tổng hợp kỳ
function printReport(){
  const list=reportTickets();const M=reportMetrics(list);const rg=reportRange();
  const row=(k,v)=>`<tr><td style="width:55%">${xmlEsc(k)}</td><td><b>${xmlEsc(v)}</b></td></tr>`;
  const per=Object.entries(M.byPerson).sort((a,b)=>b[1].q/b[1].n-a[1].q/a[1].n).map(([p,x])=>`<tr><td>${xmlEsc(p)}</td><td>${x.n}</td><td>${Math.round(x.q/x.n)}</td><td>${x.csatN?(x.csat/x.csatN).toFixed(1):'–'}</td></tr>`).join("");
  const b=docHeader("Báo cáo tổng hợp kỳ","")+`<div style="text-align:center;margin-bottom:8px">Kỳ báo cáo: <b>${xmlEsc(rg.label)}</b>${rg.a?` (${rg.a.toLocaleDateString('vi-VN')} → ${rg.b?rg.b.toLocaleDateString('vi-VN'):'nay'})`:''}</div>
    <h3>Khối lượng</h3><table>${row('Tổng tiếp nhận',M.tong)}${row('Đã hoàn tất',M.done)}${row('Đang mở',M.open)}${row('Bị trả lại',M.traLai)}${row('Bị từ chối',M.rejected)}${row('Bị mở lại',M.moLai)}</table>
    <h3>SLA</h3><table>${row('Đạt SLA phản hồi',M.respRate==null?'–':M.respRate+'%')}${row('Đạt SLA xử lý',M.resRate==null?'–':M.resRate+'%')}${row('Số ca vi phạm',M.viol)}${row('Thời gian xử lý bình quân',M.tbXuLy+' giờ')}</table>
    <h3>Chất lượng</h3><table>${row('CSAT bình quân',M.csatAvg||'–')}${row('Điểm chất lượng bình quân',M.qAvg||'–')}</table>
    ${per?`<table><tr><th>Người thực hiện</th><th>Số ticket đóng</th><th>Điểm CL BQ</th><th>CSAT BQ</th></tr>${per}</table>`:''}
    <h3>Phát sinh</h3><table>${row('Tổng phát sinh',M.psTong)}${row('Chủ quan / Khách quan / Do NYC',M.psNN['Chủ quan']+' / '+M.psNN['Khách quan']+' / '+M.psNN['Do người yêu cầu'])}${row('Chi phí đề xuất',fmtVnd(M.cpDX))}${row('Chi phí được duyệt',fmtVnd(M.cpDuyet))}</table>
    <h3>Điều hành</h3><table>${row('Số lần xung đột ưu tiên',M.conflict)}</table>
    <div style="margin-top:26px;text-align:right"><div class="s" style="font-style:italic;color:#666">Người lập báo cáo</div><div style="height:56px"></div><div style="font-weight:700">${xmlEsc(ME?ME.name:'')}</div></div>`;
  printDoc("Báo cáo kỳ "+rg.label,b);
}

let USERS=[];
async function renderUsers(){
  if(!can("users")){document.getElementById("view").innerHTML='<div class="empty">Bạn không có quyền truy cập trang này.</div>';return;}
  try{USERS=await api("GET","/api/users");}catch(e){return;}
  const rows=USERS.map(u=>`<tr>
    <td class="mono">${esc(u.username)}${u.username===ME.username?' <span class="muted">(bạn)</span>':''}</td>
    <td>${esc(u.name)}${u.chucdanh?`<div class="muted" style="font-size:11.5px">${esc(u.chucdanh)}</div>`:''}</td>
    <td><span class="role-badge role-${u.role}">${esc(ROLE_VI[u.role]||u.role)}</span>${u.canProxy?'<div class="muted" style="font-size:11px;margin-top:2px">+ tạo thay</div>':''}</td>
    <td>${esc(u.dept||'–')}</td>
    <td class="muted" style="font-size:12px">${esc(u.sdt||'')}${u.email?'<br>'+esc(u.email):''}</td>
    <td>${(u.trangthai||'active')==='active'?'<span class="pill green"><span class="dot"></span>Hoạt động</span>':'<span class="pill gray"><span class="dot"></span>Ngưng</span>'}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn sm" onclick="openUser('${esc(u.username)}')">Sửa</button>
      ${u.username!==ME.username?`<button class="btn sm danger" onclick="delUser('${esc(u.username)}')">Xóa</button>`:''}
    </td></tr>`).join("");
  document.getElementById("view").innerHTML=`
    <div class="toolbar"><div class="muted">Tổng ${USERS.length} tài khoản</div><div class="spacer" style="flex:1"></div>
      <button class="btn primary sm" onclick="openUser()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 5v14M5 12h14"/></svg>Thêm người dùng</button></div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Phòng ban</th><th>Liên hệ</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Giải thích vai trò</h3></div><div class="panel-b" style="display:grid;gap:8px;font-size:13px">
      <div><span class="role-badge role-admin">Quản trị hệ thống</span> — toàn quyền + quản lý người dùng.</div>
      <div><span class="role-badge role-dieuphoi">Điều phối / Trưởng bộ phận</span> — xem tất cả, phân công, phê duyệt phát sinh, xóa.</div>
      <div><span class="role-badge role-xuly">Nhân viên xử lý</span> — xem &amp; cập nhật ticket, ghi phát sinh (không phê duyệt/xóa).</div>
      <div><span class="role-badge role-yeucau">Người yêu cầu</span> — tạo &amp; xem ticket của phòng mình.</div>
      <div><span class="role-badge role-giamdoc">Ban giám đốc</span> — chỉ xem toàn bộ (không chỉnh sửa).</div>
    </div></div>`;
}
let EDITU=null,U_EDITING=false;
function openUser(username){
  const ex=username?USERS.find(u=>u.username===username):null;
  U_EDITING=!!ex;
  EDITU=ex?{username:ex.username,name:ex.name,role:ex.role,dept:ex.dept||"",chucdanh:ex.chucdanh||"",sdt:ex.sdt||"",email:ex.email||"",trangthai:ex.trangthai||"active",canProxy:!!ex.canProxy,password:""}
          :{username:"",name:"",role:"yeucau",dept:CAT.donvi[0],chucdanh:"",sdt:"",email:"",trangthai:"active",canProxy:false,password:""};
  const roleOpts=Object.keys(ROLE_VI).map(r=>`<option value="${r}" ${r===EDITU.role?'selected':''}>${ROLE_VI[r]}</option>`).join("");
  const deptList=["Phòng Hỗ trợ",...CAT.donvi];
  const deptOpts=deptList.map(d=>`<option ${d===EDITU.dept?'selected':''}>${esc(d)}</option>`).join("");
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:600px">
    <div class="modal-h"><h3>${U_EDITING?"Sửa người dùng "+esc(EDITU.username):"Thêm người dùng"}</h3><div class="spacer"></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="form-grid">
      <div class="f"><label>Tên đăng nhập <span class="req">*</span></label><input value="${esc(EDITU.username)}" ${U_EDITING?'disabled style="background:#f0f4f2;color:var(--ink-3)"':''} oninput="EDITU.username=this.value"></div>
      <div class="f"><label>Họ tên</label><input value="${esc(EDITU.name)}" oninput="EDITU.name=this.value"></div>
      <div class="f"><label>Chức danh</label><input value="${esc(EDITU.chucdanh)}" placeholder="VD: Nhân viên, Trưởng phòng" oninput="EDITU.chucdanh=this.value"></div>
      <div class="f"><label>Phòng ban</label><select onchange="EDITU.dept=this.value">${deptOpts}</select></div>
      <div class="f"><label>Vai trò <span class="req">*</span></label><select onchange="EDITU.role=this.value">${roleOpts}</select></div>
      <div class="f"><label>Trạng thái</label><select onchange="EDITU.trangthai=this.value"><option value="active" ${EDITU.trangthai==='active'?'selected':''}>Đang hoạt động</option><option value="inactive" ${EDITU.trangthai==='inactive'?'selected':''}>Ngưng hoạt động</option></select></div>
      <div class="f"><label>Số điện thoại</label><input value="${esc(EDITU.sdt)}" oninput="EDITU.sdt=this.value"></div>
      <div class="f"><label>Email</label><input value="${esc(EDITU.email)}" oninput="EDITU.email=this.value"></div>
      <div class="f full"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" style="width:auto;flex:none" ${EDITU.canProxy?'checked':''} onchange="EDITU.canProxy=this.checked"> <span>Cho phép <b>tạo phiếu thay phòng ban khác</b></span></label></div>
      <div class="f full"><label>${U_EDITING?"Đặt lại mật khẩu (để trống nếu giữ nguyên)":"Mật khẩu"} ${U_EDITING?'':'<span class="req">*</span>'}</label><input type="text" value="" placeholder="Tối thiểu 8 ký tự, có chữ và số" oninput="EDITU.password=this.value"><div class="hint">Người dùng sẽ được yêu cầu đổi mật khẩu ở lần đăng nhập đầu.</div></div>
      ${EDITU.role==='yeucau'?'<div class="hint" style="grid-column:1/-1">Người yêu cầu chỉ thấy ticket có <b>Đơn vị</b> trùng phòng ban ở trên (hoặc do chính họ tạo).</div>':''}
    </div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveUser()">Lưu</button></div></div>`;
  document.getElementById("overlay").classList.add("show");
}
async function saveUser(){
  const u=EDITU;
  if(!U_EDITING){if(!u.username.trim()||!u.password){toast("Nhập tên đăng nhập và mật khẩu",true);return;}}
  if(u.password && !pwOk(u.password)){toast("Mật khẩu phải từ 8 ký tự, có cả chữ và số",true);return;}
  try{
    if(U_EDITING){await api("PUT","/api/users/"+encodeURIComponent(u.username),{name:u.name,role:u.role,dept:u.dept,password:u.password||undefined});}
    else{await api("POST","/api/users",u);}
    closeModal();renderUsers();toast("Đã lưu người dùng");
  }catch(e){toast(e.message||"Lỗi lưu",true);}
}
async function delUser(username){
  if(!confirm("Xóa tài khoản "+username+"?"))return;
  try{await api("DELETE","/api/users/"+encodeURIComponent(username));renderUsers();toast("Đã xóa tài khoản");}
  catch(e){toast(e.message||"Lỗi xóa",true);}
}

/* ============================ ĐĂNG NHẬP / ĐĂNG XUẤT ============================ */
function showLogin(){document.getElementById("login").classList.add("show");ME=null;}
function hideLogin(){document.getElementById("login").classList.remove("show");}
async function doLogin(ev){
  ev.preventDefault();
  const err=document.getElementById("loginErr");err.classList.remove("show");
  const username=document.getElementById("lgUser").value.trim();
  const password=document.getElementById("lgPass").value;
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
    const d=await r.json();
    if(!r.ok){err.textContent=d.error||"Đăng nhập thất bại";err.classList.add("show");return;}
    ME=d.user;CAP=d.cap;ROLELABEL=d.roleLabel;
    hideLogin();document.getElementById("lgPass").value="";
    await startApp();
    if(d.mustChange)setTimeout(()=>openChangePw(true),400);
  }catch(e){err.textContent="Không kết nối được máy chủ";err.classList.add("show");}
}
async function doLogout(){try{await fetch("/api/logout",{method:"POST"});}catch(e){}ME=null;CAP={};showLogin();}
let FORCE_PW=false;
function openChangePw(force){
  FORCE_PW=!!force;
  document.getElementById("overlay").innerHTML=`<div class="modal" style="max-width:460px">
    <div class="modal-h"><h3>Đổi mật khẩu</h3><div class="spacer"></div>${force?'':'<button class="x" onclick="closeModal()">✕</button>'}</div>
    <div class="modal-b">
      ${force?`<div class="login-err show" style="background:var(--amber-bg);color:#8a6500;margin-bottom:14px">Đây là lần đăng nhập đầu tiên — bạn cần đổi mật khẩu mặc định trước khi sử dụng hệ thống.</div>`:''}
      <div class="form-grid">
      <div class="f full"><label>Mật khẩu hiện tại</label><input id="cpOld" type="password" autocomplete="current-password"></div>
      <div class="f full"><label>Mật khẩu mới</label><input id="cpNew" type="password" autocomplete="new-password"><div class="hint">Tối thiểu 8 ký tự, có cả chữ và số.</div></div>
      <div class="f full"><label>Nhập lại mật khẩu mới</label><input id="cpNew2" type="password" autocomplete="new-password"></div>
    </div></div>
    <div class="modal-f">${force?'':'<button class="btn" onclick="closeModal()">Để sau</button>'}<button class="btn primary" onclick="saveChangePw()">Đổi mật khẩu</button></div></div>`;
  document.getElementById("overlay").classList.add("show");
}
function pwOk(p){return String(p).length>=8 && /[A-Za-z]/.test(p) && /[0-9]/.test(p);}
async function saveChangePw(){
  const o=document.getElementById("cpOld").value,n=document.getElementById("cpNew").value,n2=document.getElementById("cpNew2").value;
  if(!pwOk(n)){toast("Mật khẩu mới phải từ 8 ký tự, có cả chữ và số",true);return;}
  if(n!==n2){toast("Mật khẩu nhập lại không khớp",true);return;}
  try{await api("POST","/api/change-password",{oldPassword:o,newPassword:n});FORCE_PW=false;closeModal();toast("Đã đổi mật khẩu");}
  catch(e){toast(e.message||"Lỗi đổi mật khẩu",true);}
}

/* ============================ TỰ ĐỘNG ĐĂNG XUẤT ============================ */
const IDLE_MS=20*60*1000; // 20 phút không hoạt động
let idleTimer=null;
function resetIdle(){
  if(!ME)return;
  clearTimeout(idleTimer);
  idleTimer=setTimeout(async()=>{ if(!ME)return; toast("Đã tự đăng xuất do không hoạt động",true); await doLogout(); }, IDLE_MS);
}
["click","keydown","mousemove","scroll","touchstart"].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

/* ============================ INIT ============================ */
let PEOPLE=[], PROJECTS=[];
async function refreshProjects(){ try{ PROJECTS=await api("GET","/api/projects"); }catch(e){ PROJECTS=[]; } }
async function startApp(){
  try{await refresh();}catch(e){setOnline(false);return;}
  try{applyConfig(await api("GET","/api/config"));}catch(e){}
  await refreshProjects();
  if(ME&&ME.canProxy){ try{PEOPLE=await api("GET","/api/people");}catch(e){PEOPLE=[];} }
  PAGE="dash";go("dash");setOnline(true);resetIdle();
}
let POLL_STARTED=false;
(async function init(){
  try{
    const r=await fetch("/api/me");
    if(!r.ok){showLogin();return;}
    const d=await r.json();ME=d.user;CAP=d.cap;ROLELABEL=d.roleLabel;
    await startApp();
    if(d.mustChange)setTimeout(()=>openChangePw(true),400);
  }catch(e){showLogin();}
  finally{if(!POLL_STARTED){POLL_STARTED=true;startPoll();}}
})();
</script>
